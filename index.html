<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#000" />
<title>alebrije</title>
<style>
  :root {
    --ink: #000;
    --paper: #f2efe6;
    --accent: #ff3422;
    --muted: rgba(242,239,230,0.5);
    --line: rgba(242,239,230,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #000; color: var(--paper);
    font-family: 'Courier New', ui-monospace, monospace;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; touch-action: none; }

.start {
position: fixed; inset: 0; z-index: 30;
display: flex; flex-direction: column; align-items: center; justify-content: center;
background: rgba(0,0,0,0.92);
backdrop-filter: blur(8px);
padding: env(safe-area-inset-top, 24px) 24px env(safe-area-inset-bottom, 24px);
transition: opacity 0.4s ease, transform 0.4s ease;
}
.start.hidden { opacity: 0; pointer-events: none; transform: scale(1.02); }
.start h1 {
font-family: 'Times New Roman', serif;
font-weight: 400; font-size: clamp(48px, 12vw, 84px);
line-height: 0.9; letter-spacing: -0.03em;
margin-bottom: 8px;
}
.start h1 em { color: var(--accent); font-style: italic; }
.start .tag { font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--muted); margin-bottom: 56px; }
.actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
.action {
background: transparent; color: var(--paper);
border: 1px solid var(--paper); padding: 18px 20px;
font-family: 'Courier New', monospace; font-size: 12px;
letter-spacing: 0.28em; text-transform: uppercase;
cursor: pointer; transition: all 0.15s ease; text-align: left;
display: flex; align-items: center; justify-content: space-between;
}
.action:hover, .action:active { background: var(--paper); color: var(--ink); }
.action.primary { border-color: var(--accent); color: var(--accent); }
.action.primary:hover, .action.primary:active { background: var(--accent); color: var(--ink); }
.action svg { width: 14px; height: 14px; }
.hint { margin-top: 32px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); text-align: center; line-height: 1.8; }
.hint kbd { font-family: 'Courier New', monospace; padding: 2px 6px; border: 1px solid var(--line); margin: 0 2px; }

input[type=file] {
  position: absolute; left: -10000px; top: auto; width: 1px; height: 1px;
  overflow: hidden; opacity: 0;
}

.hud { position: fixed; inset: 0; pointer-events: none; z-index: 10;
padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px);
display: flex; flex-direction: column; justify-content: space-between;
transition: opacity 0.5s ease;
}
.hud.idle { opacity: 0; }
.hud.hidden { opacity: 0 !important; }

.top, .bottom { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.bottom-group { display: flex; flex-direction: column; gap: 0; }

.stamp {
font-family: 'Times New Roman', serif; font-style: italic; font-size: 13px; line-height: 1.2;
padding: 4px 0;
}
.stamp b { display: block; font-style: normal; font-weight: 400;
font-family: 'Courier New', monospace; font-size: 9px;
letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
}
.back-btn {
display: inline-flex; align-items: center; gap: 8px;
background: rgba(0, 0, 0, 0.55);
border: 1px solid var(--accent);
color: var(--accent);
font-family: 'Courier New', monospace;
font-size: 11px;
letter-spacing: 0.28em;
text-transform: uppercase;
padding: 9px 14px;
cursor: pointer;
pointer-events: auto;
backdrop-filter: blur(6px);
-webkit-backdrop-filter: blur(6px);
transition: all 0.15s ease;
}
.back-btn svg {
width: 14px; height: 14px;
flex-shrink: 0;
}
.back-btn:hover, .back-btn:active {
background: var(--accent);
color: #000;
}

.meta { text-align: right; font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); line-height: 1.9; }
.meta s { text-decoration: none; color: var(--paper); }

.scene-info { display: flex; align-items: flex-end; }
/* Unified bottom player bar — buttons + inline waveform + time */
.controls {
  pointer-events: auto;
  display: flex; align-items: center;
  justify-content: space-between;
  gap: 4px; padding: 4px 6px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  width: 100%;
  min-width: 0;
}
.ctrl {
  background: transparent; color: var(--paper); border: none;
  width: 44px; height: 44px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s ease;
}
.ctrl:hover, .ctrl:active { background: rgba(242,239,230,0.12); }
.ctrl.active { background: var(--accent); color: #000; }
.ctrl svg { width: 18px; height: 18px; stroke-width: 1.6; }

/* Inline waveform + time group — grows to fill between button clusters */
.wave-group {
  flex: 1 1 0; min-width: 0;
  display: flex; align-items: center; gap: 8px;
  padding: 0 6px;
  overflow: hidden;
}
.wave-group[hidden] { display: none; }
.t-label {
  font-family: 'Courier New', monospace;
  font-size: 10px; letter-spacing: 0.08em; color: var(--muted);
  min-width: 34px; text-align: center;
  font-variant-numeric: tabular-nums;
  user-select: none;
  flex: 0 0 auto;
}
#waveCanvas {
  flex: 1 1 0; min-width: 0;
  width: auto; height: 32px;
  display: block;
  position: static;
  cursor: pointer; touch-action: none;
}
@media (max-width: 480px) {
  .wave-group { gap: 6px; padding: 0 4px; }
  #waveCanvas { height: 28px; }
  .t-label { font-size: 9px; min-width: 30px; letter-spacing: 0.04em; }
  .ctrl { width: 40px; height: 40px; }
}

.x { position: fixed; width: 12px; height: 12px; opacity: 0.35; z-index: 5; pointer-events: none; transition: opacity 0.5s; }
.x::before, .x::after { content: ''; position: absolute; background: var(--paper); }
.x::before { width: 12px; height: 1px; top: 0; }
.x::after { width: 1px; height: 12px; left: 0; }
.x.tl { top: 8px; left: 8px; }
.x.tr { top: 8px; right: 8px; transform: scaleX(-1); }
.x.bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
.x.br { bottom: 8px; right: 8px; transform: scale(-1,-1); }

.toast { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%) translateY(8px);
background: rgba(0,0,0,0.85); border: 1px solid var(--accent); color: var(--accent);
padding: 10px 18px; font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
z-index: 40; opacity: 0; transition: all 0.25s ease; pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.paste-pulse { position: fixed; inset: 0; z-index: 25; pointer-events: none; opacity: 0;
background: radial-gradient(circle at center, rgba(255,52,34,0.2), transparent 60%);
}
.paste-pulse.show { animation: pulseFade 0.8s ease forwards; }
@keyframes pulseFade { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }

.drop { position: fixed; inset: 16px; border: 2px dashed var(--accent); z-index: 28;
display: none; align-items: center; justify-content: center;
background: rgba(255,52,34,0.08); backdrop-filter: blur(4px);
font-family: 'Times New Roman', serif; font-style: italic; font-size: 28px; color: var(--accent);
pointer-events: none;
}
.drop.show { display: flex; }

@media (max-width: 480px) {
.meta { font-size: 8px; letter-spacing: 0.18em; }
.stamp { font-size: 12px; }
}

/* Play overlay (iOS audio unlock) */
#playOverlay {
position: fixed; inset: 0; z-index: 35;
display: none; align-items: center; justify-content: center;
background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
opacity: 0; transition: opacity 0.35s ease;
cursor: pointer;
}
#playOverlay.show { opacity: 1; }
.play-card { text-align: center; padding: 32px; pointer-events: none; }
.play-circle {
width: 96px; height: 96px; border: 2px solid var(--accent); border-radius: 50%;
display: flex; align-items: center; justify-content: center;
margin: 0 auto 24px; color: var(--accent);
animation: pulseRing 2s ease-in-out infinite;
}
.play-circle svg { width: 40px; height: 40px; margin-left: 4px; }
@keyframes pulseRing {
0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,52,34,0.4); }
50%      { transform: scale(1.05); box-shadow: 0 0 0 18px rgba(255,52,34,0); }
}
.play-label {
font-family: 'Times New Roman', serif; font-style: italic; font-size: 28px; color: var(--paper);
margin-bottom: 12px;
}
.play-hint {
font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted);
}

/* Persistent diagnostic readout — helps debug mobile issues */
#diag {
position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 99999;
font-family: 'Courier New', monospace; font-size: 10px; line-height: 1.4;
color: #00ff88; background: rgba(0,0,0,0.75);
border: 1px solid rgba(0,255,136,0.5); border-radius: 4px;
padding: 8px 10px; max-height: 140px; overflow-y: auto;
display: none; white-space: pre-wrap; word-break: break-word;
pointer-events: none;
}
#diag.show { display: block; }
</style>

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const W = () => Math.floor(window.innerWidth  * Math.min(window.devicePixelRatio, 2));
const H = () => Math.floor(window.innerHeight * Math.min(window.devicePixelRatio, 2));

const camFs = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const sceneFs = new THREE.Scene();
const quadGeo = new THREE.PlaneGeometry(2,2);

function makeRT(w, h){
  return new THREE.WebGLRenderTarget(Math.max(2,Math.floor(w)), Math.max(2,Math.floor(h)), {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    type: THREE.HalfFloatType, format: THREE.RGBAFormat
  });
}
let rtMain = makeRT(W(), H());
let rtPrev = makeRT(W(), H());
let rtBloomA = makeRT(W()/2, H()/2);
let rtBloomB = makeRT(W()/2, H()/2);
let rtBloomC = makeRT(W()/4, H()/4);
let rtBloomD = makeRT(W()/4, H()/4);

const mainUniforms = {
  uTime:{value:0}, uRes:{value:new THREE.Vector2()},
  uBass:{value:0}, uMid:{value:0}, uTreb:{value:0}, uLevel:{value:0},
  uBeat:{value:0}, uBeatDecay:{value:0},
  // Dual-scene crossfade: uSceneMix 0 = pure A, 1 = pure B, interp between.
  uSceneA:{value:0}, uSceneB:{value:0}, uSceneMix:{value:0},
  uHue:{value:0},
  uPrev:{value:null}, uFeedback:{value:0.92}, uWarp:{value:0.004},
  uPalette:{value:0}, uZoom:{value:1.0},
  uRotX:{value:0}, uRotY:{value:0},
  // Accumulated forward-flight position. Incremented smoothly in JS every
  // frame so the scene fly-through never jerks with audio level.
  uFwd:{value:0},
};

const mainFrag = `
precision highp float;

uniform vec2  uRes;
uniform float uTime, uBass, uMid, uTreb, uLevel, uBeat, uBeatDecay, uFwd;
uniform float uSceneA, uSceneB, uSceneMix;
uniform float uHue, uFeedback, uWarp, uPalette, uZoom;
uniform float uRotX, uRotY;
uniform sampler2D uPrev;

const float PI = 3.14159265359;
const float TAU = 6.28318530718;

vec3 cosPal(float t, vec3 a, vec3 b, vec3 c, vec3 d){ return a + b*cos(TAU*(c*t+d)); }
vec3 pal(float t){
  int p = int(uPalette + 0.5);
  if(p == 0) return cosPal(t, vec3(0.55,0.40,0.50), vec3(0.55,0.55,0.50), vec3(1,1,0.9), vec3(0.0,0.2+uHue*0.4,0.55));
  if(p == 1) return cosPal(t, vec3(0.5),           vec3(0.5),           vec3(1,0.7,0.4), vec3(0.0,0.15,0.20));
  if(p == 2) return cosPal(t, vec3(0.8,0.5,0.4),   vec3(0.2,0.4,0.2),   vec3(2,1,1),     vec3(0.0,0.25,0.25));
  if(p == 3) return cosPal(t, vec3(0.5),           vec3(0.5),           vec3(2,1,0),     vec3(0.5,0.2,0.25));
  if(p == 4) return cosPal(t, vec3(0.6,0.4,0.7),   vec3(0.4,0.4,0.4),   vec3(1,1,2),     vec3(0,0.1,0.2));
  // Palette 5: NEON CYBERPUNK — magenta/pink shifting to cyan
  return cosPal(t, vec3(0.5, 0.3, 0.6), vec3(0.6, 0.5, 0.5), vec3(1.0, 0.7, 0.5), vec3(0.95, 0.5, 0.2));
}

mat2 rot(float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){ float v=0., a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.0; a*=0.5;} return v; }

float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }
float sdOct(vec3 p, float s){ p=abs(p); return (p.x+p.y+p.z-s)*0.57735; }
float sdTorus(vec3 p, vec2 t){ vec2 q=vec2(length(p.xz)-t.x,p.y); return length(q)-t.y; }
float sdSphere(vec3 p, float r){ return length(p)-r; }
float sdCross(vec3 p, float s){
  float a = sdBox(p, vec3(s, s*0.2, s*0.2));
  float b = sdBox(p, vec3(s*0.2, s, s*0.2));
  float c = sdBox(p, vec3(s*0.2, s*0.2, s));
  return min(min(a,b),c);
}
float smin(float a,float b,float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }

// Low-frequency domain warp — bends the whole space with three cheap sines
// so the cell grid curves through space instead of reading as a repeating
// lattice. Amplitude × frequency stays < ~0.15 so Jacobian remains close to
// identity (raymarch step factor 0.65 tolerates the small metric stretch).
vec3 warpDomain(vec3 p, float amt){
  return p + vec3(
    sin(p.y*0.35 + p.z*0.28 + uTime*0.15),
    sin(p.z*0.32 + p.x*0.30 + uTime*0.17),
    sin(p.x*0.38 + p.y*0.26 + uTime*0.12)
  ) * amt;
}

vec2 kaleido(vec2 p, float n){
  float a=atan(p.y,p.x), r=length(p), seg=TAU/n;
  a=mod(a,seg); a=abs(a-seg*0.5);
  return vec2(cos(a),sin(a))*r;
}

float mapLattice(vec3 p){
  p.z += uFwd * 1.0;

  // MANDALA FOLD — reflect xy into N wedges around the forward axis.
  // Fewer wedges (4-7 vs 6-12) keeps the mandala legible rather than
  // feeling like a blur of repeated cells. Step cadence is slower too.
  // kaleido is an isometry on xy so the SDF stays Lipschitz-1 safe.
  float wedges = 4.0 + mod(floor(uTime*0.12), 4.0); // 4,5,6,7 every ~8s
  p.xy = kaleido(p.xy, wedges);

  // Gentler rotation of the whole mandala
  p.xy *= rot(uTime*0.04 + uBass*0.15);
  p.xz *= rot(uTime*0.02);
  // Lower warp so the symmetry reads clean
  p = warpDomain(p, 0.18);

  // Larger cells = more air between shapes
  float CELL = 1.8;
  vec3 cellId = floor((p + CELL*0.5) / CELL);
  vec3 q1 = mod(p + CELL*0.5, CELL) - CELL*0.5;
  float cellH = fract(sin(dot(cellId, vec3(127.1, 311.7, 74.7)))*43758.5453);
  float cellH2 = fract(sin(dot(cellId, vec3(91.7, 217.3, 51.1)))*43758.5453);

  // Only ~55% of cells fire — thinner mandala, not a dense wall
  float existence = smoothstep(0.35, 0.55, cellH);

  // Per-cell spin — gentler tumble
  vec3 qRot = q1;
  float spin = uTime * 0.30 + cellH * TAU + uBeatDecay * 0.6;
  qRot.xy *= rot(spin);
  qRot.yz *= rot(spin * 0.7);

  // Smaller shape — max ~0.42 (vs CELL/2 = 0.90), much more breathing room
  float shapeSize = (0.14 + cellH * 0.10 + uBass * 0.12 + uBeatDecay * 0.06) * existence;
  shapeSize = max(shapeSize, 0.001);

  // Shape morph kept (it's the vibe) but on a slower clock
  float morphT = uTime * 0.20 + uMid * 1.4 + cellH * 3.14;
  float morph = 0.5 + 0.5 * sin(morphT);
  float oct = sdOct(qRot, shapeSize);
  float box = sdBox(qRot, vec3(shapeSize * 0.72));
  float shape = mix(oct, box, morph);

  // Thinner struts, and only draw on half the cells to stop the grid
  // from reading as a solid lattice. Per-cell hash gates whether struts
  // are even present in that cell.
  float strutGate = smoothstep(0.55, 0.70, cellH2);
  vec3 ap = abs(q1);
  float STRUT = (0.020 + uTreb * 0.020) * strutGate + 0.001;
  float strutX = max(ap.y, ap.z) - STRUT;
  float strutY = max(ap.x, ap.z) - STRUT;
  float strutZ = max(ap.x, ap.y) - STRUT;
  float struts = min(min(strutX, strutY), strutZ);

  // Smooth union — blend radius smaller so features stay distinct
  float d = smin(shape, struts, 0.04 + uBeatDecay * 0.04);
  return d;
}

float mapPlasma(vec3 p){
  p.z += uFwd * 0.9;
  p.x += sin(uTime*0.15) * 0.4;
  p.y += cos(uTime*0.12) * 0.3;

  p.xz *= rot(uTime*0.04 + uBass*0.30);
  p.xy *= rot(uTime*0.02 + uMid*0.25);
  // Warp — bends the cross forest so it doesn't read as a rigid grid
  p = warpDomain(p, 0.30);

  // Two scales of crosses, well-spaced
  vec3 q1 = mod(p + 1.0, 2.0) - 1.0;
  vec3 q2 = mod(p + 0.35, 0.7) - 0.35;

  // Gyrate the crosses themselves — big scale spins slow, small spins fast
  // in the opposite direction so the two lattices weave.
  float spin = uTime*0.35 + uBeatDecay*0.8;
  q1.xy *= rot(spin);
  q1.yz *= rot(spin*0.6);
  q2.xy *= rot(-spin*0.9);
  q2.xz *= rot(spin*0.5);

  // Sizes capped — max big cross ~0.56 (vs half-cell 1.0), small ~0.19
  // (vs half-cell 0.35). Keeps plenty of clearance even on hard beats.
  float c1 = sdCross(q1, 0.20 + 0.18*uBass + 0.10*uBeatDecay);
  float c2 = sdCross(q2, 0.07 + 0.07*uMid  + 0.05*uBeatDecay);

  // Smooth union radius grows on beats so the two scales fuse into a blob
  float d = smin(c1, c2, 0.04 + uBeatDecay*0.06);
  return d;
}

// VOXEL CLUSTER — flythrough a sparse field of architectural cubes
float mapVoxels(vec3 p){
  p.z += uFwd * 1.25;
  p.xz *= rot(uTime*0.05 + uBass*0.22);
  p.xy *= rot(uTime*0.02);
  // Warp bends the skyline so columns snake through space, not along z
  p = warpDomain(p, 0.45);

  // Larger cells + higher existence threshold = more air between cubes
  float CELL = 1.7;
  vec3 cellId = floor((p + CELL*0.5) / CELL);
  vec3 q = mod(p + CELL*0.5, CELL) - CELL*0.5;

  float h1 = fract(sin(dot(cellId, vec3(127.1, 311.7, 74.7)))*43758.5453);
  float h2 = fract(sin(dot(cellId, vec3(91.7, 217.3, 51.1)))*43758.5453);
  float h3 = fract(sin(dot(cellId, vec3(53.7, 113.5, 179.3)))*43758.5453);

  // Higher threshold -> fewer filled cells (~28% vs ~42%)
  float existence = smoothstep(0.64, 0.78, h1);

  // Per-cell xy offset — breaks the column-centered alignment so voxels
  // don't read as a rigid axis-aligned lattice when moving
  vec3 off = vec3((h2 - 0.5) * 0.5, (h3 - 0.5) * 0.4, (h1 - 0.5) * 0.5);

  // Base size — pumps with bass, slams on beats. Capped lower so the
  // worst case (size * stretchY) stays under half-cell to keep the
  // flight path clear.
  float vSize = (0.15 + h2 * 0.16 + uBass * 0.14 + uBeatDecay * 0.10) * existence;
  vSize = max(vSize, 0.001);

  // Per-axis stretch — bounded so max y-extent ≈ vSize * 1.7 stays inside
  // the cell even on peak beats. Towers still stretch tall but won't
  // grow large enough to box the camera in.
  float stretchY = 1.0 + uBeatDecay*0.55 + uBass*0.30
                     + 0.18*sin(uTime*0.35 + h1*TAU);
  float stretchX = 1.0 + 0.15*sin(uTime*0.25 + h2*TAU);
  float stretchZ = 1.0 + 0.14*sin(uTime*0.30 + h1*TAU + 1.3);

  return sdBox(q - off, vec3(vSize*stretchX, vSize*stretchY, vSize*stretchZ));
}

// CRYSTAL FIELD — scattered octahedral crystals in a flythrough
float mapCrystals(vec3 p){
  p.z += uFwd * 1.75;
  p.xz *= rot(uTime*0.04 + uBass*0.25);
  // Warp so the z-columns of crystals curve through space
  p = warpDomain(p, 0.40);

  float CELL = 1.0;
  vec2 cellId = floor((p.xy + CELL*0.5) / CELL);
  vec2 q = mod(p.xy + CELL*0.5, CELL) - CELL*0.5;

  float h1 = fract(sin(dot(cellId, vec2(127.1, 311.7)))*43758.5453);
  float h2 = fract(sin(dot(cellId, vec2(91.7, 217.3)))*43758.5453);
  float h3 = fract(sin(dot(cellId, vec2(53.7, 113.5)))*43758.5453);

  float zOffset = h2 * 4.0;
  float zPos = mod(p.z + zOffset, 4.0) - 2.0;

  float existence = smoothstep(0.20, 0.40, h1);
  // Max crysSize capped at ~0.47 (vs half-cell 0.5) so crystals don't
  // poke into the neighbour cell on heavy bass.
  float crysSize = (0.14 + h1 * 0.12 + uBass * 0.14 + uBeatDecay * 0.10) * existence;
  crysSize = max(crysSize, 0.001);

  // Per-cell xy offset breaks the centered-on-grid feel
  vec2 off = vec2((h2 - 0.5) * 0.35, (h3 - 0.5) * 0.35);

  // Each crystal spins at its own rate (h1 seeds the tempo) so the field
  // shimmers like real gems catching light.
  vec3 cq = vec3(q.x - off.x, q.y - off.y, zPos);
  float spin = uTime * (0.45 + h1*0.55) + h1 * TAU;
  cq.xy *= rot(spin);
  cq.xz *= rot(spin * 0.55);

  // Axial squash on bass — crystals elongate vertically when the low end
  // hits. Dividing by (1+uBass*K) SHRINKS the y coord, which keeps the
  // SDF conservative (Lipschitz-safe) for raymarching. K reduced so
  // elongation fits inside the cell.
  cq.y *= 1.0 / (1.0 + uBass * 0.35);

  return sdOct(cq, crysSize);
}

// BUBBLE NEBULA — organic metaball spheres that merge softly, breathing with bass
float mapBubbles(vec3 p){
  p.z += uFwd * 1.05;
  // Gentle drift to feel like floating through a cloud
  p.x += sin(uTime*0.18) * 0.30;
  p.y += cos(uTime*0.14) * 0.24;
  p.xz *= rot(uTime*0.03 + uBass*0.18);
  // Warp bends the nebula so bubbles don't sit on a rigid axis-aligned grid
  p = warpDomain(p, 0.38);

  // Larger cells + higher threshold = much sparser nebula
  float CELL = 1.55;
  vec3 cellId = floor((p + CELL*0.5) / CELL);
  vec3 q = mod(p + CELL*0.5, CELL) - CELL*0.5;

  float h1 = fract(sin(dot(cellId, vec3(127.1, 311.7, 74.7)))*43758.5453);
  float h2 = fract(sin(dot(cellId, vec3(91.7, 217.3, 51.1)))*43758.5453);
  float h3 = fract(sin(dot(cellId, vec3(53.7, 113.5, 179.3)))*43758.5453);

  // Off-center sphere per cell — also DRIFTS with time so bubbles swim
  vec3 off = (vec3(h1, h2, h3) - 0.5) * 0.40;
  off.x += 0.12 * sin(uTime*0.7 + h1*TAU);
  off.y += 0.12 * cos(uTime*0.6 + h2*TAU);
  off.z += 0.10 * sin(uTime*0.5 + h3*TAU);

  // Higher threshold -> far fewer bubbles (~32% fill vs ~60%)
  float existence = smoothstep(0.52, 0.74, h1);
  // Stronger per-cell breathing — bubbles visibly inhale/exhale
  float breath = 0.10 * sin(uTime*1.6 + h1*18.0);
  float radius = (0.20 + h2*0.14 + uBass*0.20 + uBeatDecay*0.12 + breath) * existence;
  radius = max(radius, 0.001);

  float d1 = sdSphere(q - off, radius);

  // Blend with the +x neighbour so adjacent spheres fuse into metaballs
  vec3 cellId2 = cellId + vec3(1.0, 0.0, 0.0);
  vec3 q2 = q - vec3(CELL, 0.0, 0.0);
  float h1b = fract(sin(dot(cellId2, vec3(127.1, 311.7, 74.7)))*43758.5453);
  float h2b = fract(sin(dot(cellId2, vec3(91.7, 217.3, 51.1)))*43758.5453);
  float h3b = fract(sin(dot(cellId2, vec3(53.7, 113.5, 179.3)))*43758.5453);
  vec3 off2 = (vec3(h1b, h2b, h3b) - 0.5) * 0.40;
  off2.x += 0.12 * sin(uTime*0.7 + h1b*TAU);
  off2.y += 0.12 * cos(uTime*0.6 + h2b*TAU);
  off2.z += 0.10 * sin(uTime*0.5 + h3b*TAU);
  float eb = smoothstep(0.52, 0.74, h1b);
  float breathB = 0.10 * sin(uTime*1.6 + h1b*18.0);
  float radiusB = (0.22 + h2b*0.18 + uBass*0.38 + uBeatDecay*0.22 + breathB) * eb;
  radiusB = max(radiusB, 0.001);
  float d2 = sdSphere(q2 - off2, radiusB);

  // Metaball blend radius grows on beats — bubbles fuse into amoeba-like
  // goo on kicks, then separate on the decay.
  return smin(d1, d2, 0.40 + uBeatDecay*0.25);
}

// HYPER TUNNEL — paneled petal corridor with morphing petal count, panels,
// rings, studs, and a bass-driven constriction pulse.
float mapTunnel(vec3 p){
  p.z += uFwd * 1.35;

  // Lateral serpentine — bass widens the swing so the tunnel snakes harder
  // during loud sections.
  p.x += sin(p.z * 0.18 + uTime*0.20) * (0.28 + uBass*0.22);
  p.y += cos(p.z * 0.15 + uTime*0.18) * (0.22 + uBass*0.18);

  // Twist — strong beat kick spins the walls past you faster
  float tw = p.z * 0.18 + uTime*0.25 + uBeatDecay*0.40;
  p.xy *= rot(tw);
  // Subtle warp — perturbs panels/rings so the tunnel surface doesn't
  // read as perfectly periodic. Smaller amplitude than other scenes
  // because we're *inside* this shape and can't afford metric stretch
  // near the walls.
  p = warpDomain(p, 0.18);

  float r = length(p.xy);
  float a = atan(p.y, p.x);

  // MORPHING PETAL COUNT — fractional petals between 5 and 7 create rolling
  // waves as the sin(a*pN) phase shifts continuously; uMid biases the count
  // so the tunnel breathes with the melody.
  float pN = 6.0 + 1.4*sin(uTime*0.14 + uMid*1.0);
  float petalR = 1.62 + 0.26*sin(a*pN + uTime*0.45)
                      + uBass*0.22 + uBeatDecay*0.18;

  // Panel checkerboard — treble sharpens the tiled relief
  float panelA = sin(a * 8.0);
  float panelZ = sin(p.z * 2.4 + uTime*0.3);
  petalR += panelA * panelZ * (0.05 + uTreb*0.04);

  // Architectural rings
  float ringPhase = fract(p.z * 0.85 + 0.5);
  float ringMask = 1.0 - smoothstep(0.0, 0.18, abs(ringPhase - 0.5));
  petalR -= ringMask * 0.09;

  // Studs — beat-reactive bumps at the ring/panel crossings
  float studA = smoothstep(0.86, 1.0, abs(sin(a * 18.0)));
  petalR -= ringMask * studA * (0.03 + uBeatDecay*0.04);

  // BASS CONSTRICTION — whole tunnel pinches tighter on low-end hits so
  // the walls feel like they're breathing against you.
  petalR -= uBass * 0.10 + uBeatDecay * 0.08;

  return abs(r - petalR) - 0.08;
}

// Single-scene SDF lookup. Glitch (sIdx==4) has no 3D geometry —
// fall back to crystals so dA/dB numerics stay sane if a caller ever
// hits that path.
float sceneSDF1(vec3 p, int sIdx){
  if(sIdx==0)      return mapLattice(p);
  else if(sIdx==1) return mapPlasma(p);
  else if(sIdx==2) return mapVoxels(p);
  else if(sIdx==3) return mapCrystals(p);
  else if(sIdx==5) return mapBubbles(p);
  else if(sIdx==6) return mapTunnel(p);
  else             return mapCrystals(p);
}

// Scene SDF with built-in A to B geometric morph. During a transition
// the whole field is mix(sceneA, sceneB, t) -- shapes from A literally
// deform into shapes from B instead of crossfading by alpha. Linear
// mix of Lipschitz-1 SDFs is Lipschitz-1 so raymarching stays stable.
// t=0 -> pure A; t=1 -> pure B; sA==sB -> no morph regardless of t.
float sceneSDF(vec3 p, int sA, int sB, float t){
  float dA = sceneSDF1(p, sA);
  if(t <= 0.001 || sA == sB) return dA;
  float dB = sceneSDF1(p, sB);
  return mix(dA, dB, t);
}

vec3 calcNormal(vec3 p, int sA, int sB, float t){
  const float e = 0.0015;
  vec2 k = vec2(1.0, -1.0);
  return normalize(
    k.xyy * sceneSDF(p + k.xyy*e, sA, sB, t) +
    k.yyx * sceneSDF(p + k.yyx*e, sA, sB, t) +
    k.yxy * sceneSDF(p + k.yxy*e, sA, sB, t) +
    k.xxx * sceneSDF(p + k.xxx*e, sA, sB, t)
  );
}

// 5-tap occlusion sampler — queries SDF along the normal for proper AO
float calcAO(vec3 p, vec3 n, int sA, int sB, float t){
  float occ = 0.0;
  float sca = 1.0;
  for(int i=0; i<5; i++){
    float h = 0.02 + 0.08 * float(i);
    float d = sceneSDF(p + n*h, sA, sB, t);
    occ += (h - d) * sca;
    sca *= 0.75;
  }
  return clamp(1.0 - 1.2*occ, 0.0, 1.0);
}

// Cheap soft shadow via SDF min-distance penumbra
float softShadow(vec3 ro, vec3 rd, int sA, int sB, float t){
  float res = 1.0;
  float tm = 0.02;
  for(int i=0; i<14; i++){
    float h = sceneSDF(ro + rd*tm, sA, sB, t);
    if(h < 0.001) return 0.0;
    res = min(res, 10.0*h/tm);
    tm += clamp(h, 0.04, 0.35);
    if(tm > 6.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

// Per-scene camera distance — blended during a transition so the
// camera eases between baseDists as the SDFs morph.
float sceneBaseDist(int sIdx){
  if(sIdx == 3) return 3.0;       // crystals
  else if(sIdx == 5) return 3.5;  // bubbles
  else if(sIdx == 6) return 0.35; // inside tunnel (non-zero for normalize)
  else return 4.0;                 // lattice, temple, voxels, default
}

vec3 raymarch3D(vec2 uv, int sA, int sB, float t){
  // Per-scene camera distance — blended so the camera eases between
  // positions during a scene morph, no abrupt jump.
  float baseDist = mix(sceneBaseDist(sA), sceneBaseDist(sB), t);
  float dist = baseDist * uZoom;

  vec3 ro = vec3(0.0, 0.0, -dist);

  vec3 rd = normalize(vec3(uv, 1.5));

  // ---- USER ROTATION (drives the flight path) ----
  // Tunnel constraint: when sIdx==6 is the dominant scene, dampen the
  // user/auto-pilot rotation so the camera always keeps the tunnel
  // opening centered. Small sway is preserved (rotScale ~0.18) so the
  // view still feels alive. During a morph in/out of tunnel the
  // damping interpolates with t so the constraint eases on/off.
  float wTunnel = 0.0;
  if(sA == 6) wTunnel += (1.0 - t);
  if(sB == 6) wTunnel += t;
  wTunnel = clamp(wTunnel, 0.0, 1.0);
  float rotScale = mix(1.0, 0.18, wTunnel);
  float urX = uRotX * rotScale;
  float urY = uRotY * rotScale;
  ro.xz *= rot(urY);
  rd.xz *= rot(urY);
  ro.yz *= rot(urX);
  rd.yz *= rot(urX);

  // ===== CAMERA COLLISION =====
  // Push the camera back along its outward direction until it has clearance.
  // Widened so beat-pumped geometry can't crowd the lens — the camera
  // retreats rather than getting boxed in by an oversized voxel/bubble.
  float CLEARANCE = 0.55;
  vec3 outward = normalize(ro);
  for(int i = 0; i < 12; i++){
    float d = sceneSDF(ro, sA, sB, t);
    if(d >= CLEARANCE) break;
    ro += outward * (CLEARANCE - d + 0.01);
  }

  float mT = 0.0;               // march distance (renamed -- t is the mix amount)
  float dmin = 999.0;
  vec3 col = vec3(0.0);
  bool hit = false;
  vec3 hitP;
  int steps = 0;
  for(int i=0; i<128; i++){
    vec3 p = ro + rd*mT;
    float d = sceneSDF(p, sA, sB, t);
    dmin = min(dmin, d);
    float eps = 0.0005 + mT * 0.00025;
    if(d < eps){ hit = true; hitP = p; steps = i; break; }
    if(mT > 18.0) break;
    mT += d * 0.65;
    steps = i;
  }

  // ===== SILHOUETTE COVERAGE (analytic AA via dmin) =====
  float aaW = 0.004 + 0.0035 * mT;
  float coverage = 1.0 - smoothstep(0.0, aaW, dmin);

  if(hit){
    vec3 n = calcNormal(hitP, sA, sB, t);
    vec3 v = -rd;

    // Two-light rig: warm key + cool fill
    vec3 keyDir  = normalize(vec3(0.55, 0.85, -0.6));
    vec3 fillDir = normalize(vec3(-0.7, 0.15, -0.4));
    vec3 keyCol  = vec3(1.05, 0.95, 0.82);
    vec3 fillCol = vec3(0.55, 0.70, 1.10);

    float ndotK = max(0.0, dot(n, keyDir));
    float ndotF = max(0.0, dot(n, fillDir));

    // Soft shadow only from the key — fill stays unshadowed
    float sh = softShadow(hitP + n*0.01, keyDir, sA, sB, t);
    sh = mix(0.4, 1.0, sh);

    float ao = calcAO(hitP, n, sA, sB, t);

    // Blinn-Phong specular for a tighter highlight
    vec3 hK = normalize(keyDir + v);
    float specK = pow(max(0.0, dot(n, hK)), 64.0) * sh;
    vec3 hF = normalize(fillDir + v);
    float specF = pow(max(0.0, dot(n, hF)), 24.0) * 0.4;

    // Palette-driven surface color, animated by position + bass
    float pt = mT*0.06 + n.x*0.25 + n.y*0.18 + uTime*0.04 + uBass*0.3;
    vec3 base = pal(pt);
    vec3 rim  = pal(pt + 0.5);

    // Lambert diffuse from two lights
    vec3 diffuse  = base * keyCol  * ndotK * sh * 0.75;
    diffuse      += base * fillCol * ndotF       * 0.35;
    // Ambient from palette so shadows stay colored, not black
    vec3 ambient  = base * vec3(0.12, 0.14, 0.18) * ao;

    col = diffuse * ao + ambient;
    col += rim * (specK + specF) * (0.5 + uTreb*0.5);

    // Fresnel rim — stronger on grazing angles, tinted by complementary palette
    float fres = pow(1.0 - max(0.0, dot(n, v)), 3.5);
    col += pal(pt + 0.3) * fres * (0.25 + uMid*0.5);

    // ===== PER-SCENE FINISHING PASSES =====
    // Each reference image has a distinct material language. During a
    // transition we crossfade finishing from A to B using weights wA/wB
    // so the material "feel" morphs along with the geometry.
    float wA = 1.0 - t;
    float wB = t;
    vec3 colA = col, colB = col;

    // Temple (sIdx 1) finishing — applied to whichever side matches
    if(sA == 1){
      colA *= 0.72;
      colA += vec3(0.04, 0.38, 0.22) * (1.0 - ndotK*sh) * 0.42;
      float edge = pow(1.0 - max(0.0, dot(n, v)), 5.0);
      colA += vec3(1.45, 1.10, 0.35) * edge * (1.15 + uBeatDecay*0.35);
    }
    if(sB == 1){
      colB *= 0.72;
      colB += vec3(0.04, 0.38, 0.22) * (1.0 - ndotK*sh) * 0.42;
      float edge = pow(1.0 - max(0.0, dot(n, v)), 5.0);
      colB += vec3(1.45, 1.10, 0.35) * edge * (1.15 + uBeatDecay*0.35);
    }

    // Voxels (sIdx 2) — cel shading. Replaces col entirely when active.
    if(sA == 2){
      float diff = clamp(ndotK * sh + ndotF*0.35, 0.0, 1.0);
      float cel  = floor(diff * 3.0 + 0.5) / 3.0;
      vec3 celShadow = vec3(0.06, 0.10, 0.16);
      vec3 celLit    = vec3(1.05, 1.00, 0.88);
      colA = base * mix(celShadow, celLit, cel) * ao;
      vec3 backDir = normalize(vec3(0.30, -0.15, 0.95));
      float back = max(0.0, dot(n, backDir));
      colA += vec3(1.40, 0.72, 0.26) * pow(back, 2.5) * (0.45 + uBass*0.35);
      float edge = pow(1.0 - max(0.0, dot(n, v)), 22.0);
      colA += vec3(1.0) * edge * 1.5;
    }
    if(sB == 2){
      float diff = clamp(ndotK * sh + ndotF*0.35, 0.0, 1.0);
      float cel  = floor(diff * 3.0 + 0.5) / 3.0;
      vec3 celShadow = vec3(0.06, 0.10, 0.16);
      vec3 celLit    = vec3(1.05, 1.00, 0.88);
      colB = base * mix(celShadow, celLit, cel) * ao;
      vec3 backDir = normalize(vec3(0.30, -0.15, 0.95));
      float back = max(0.0, dot(n, backDir));
      colB += vec3(1.40, 0.72, 0.26) * pow(back, 2.5) * (0.45 + uBass*0.35);
      float edge = pow(1.0 - max(0.0, dot(n, v)), 22.0);
      colB += vec3(1.0) * edge * 1.5;
    }

    // Bubbles (sIdx 5) — iridescent dispersion
    if(sA == 5){
      float fIri = pow(1.0 - max(0.0, dot(n, v)), 1.4);
      vec3 iriCol = 0.5 + 0.5*cos(TAU * vec3(1.00, 0.92, 0.80) * fIri
                                 + vec3(0.0, 0.33, 0.67)
                                 + uTime*0.12);
      colA = mix(colA, colA * 1.45 * iriCol, fIri * 0.55);
      float rimDot = pow(1.0 - max(0.0, dot(n, v)), 8.0);
      colA += iriCol * rimDot * 0.6 * (0.5 + uMid*0.5);
    }
    if(sB == 5){
      float fIri = pow(1.0 - max(0.0, dot(n, v)), 1.4);
      vec3 iriCol = 0.5 + 0.5*cos(TAU * vec3(1.00, 0.92, 0.80) * fIri
                                 + vec3(0.0, 0.33, 0.67)
                                 + uTime*0.12);
      colB = mix(colB, colB * 1.45 * iriCol, fIri * 0.55);
      float rimDot = pow(1.0 - max(0.0, dot(n, v)), 8.0);
      colB += iriCol * rimDot * 0.6 * (0.5 + uMid*0.5);
    }

    // Blend finishings by mix weight — same linear blend as the geometry
    col = mix(colA, colB, t);

    // ===== NEAR-CLIP FADE =====
    float nearFade = smoothstep(0.0, 0.35, mT);
    col *= nearFade;

    // ===== DISTANCE FOG =====
    vec3 fogCol = pal(uTime*0.03 + 0.6) * 0.35;
    float fogAmt = 1.0 - exp(-mT * 0.11);
    col = mix(col, fogCol, fogAmt * 0.55);
    // Apply silhouette coverage so the hit color fades to 0 at the edge
    // instead of dropping to background in one pixel.
    col *= coverage;
  }
  // Volumetric glow from near-misses — stronger on mid/treb for beat-sync feel
  float glow = exp(-dmin*3.5) * (0.18 + uMid*0.35 + uTreb*0.15);
  col += pal(uTime*0.07 + 0.4) * glow * 0.35;
  return col;
}

// ============================================================
// SCENE: GLITCH FIELD — multilayered data display, less repetitive
// ============================================================
vec3 sceneGlitch(vec2 uv){
  vec2 p = uv;

  // Macro slice glitches at irregular intervals
  float bigSlice = floor(p.y * (12.0 + uMid*8.0));
  float bigSeed = fract(sin(bigSlice*45.21 + floor(uTime*1.7))*43758.5453);
  float bigJump = step(0.82, bigSeed) * (bigSeed-0.5) * 0.5;
  p.x += bigJump * (0.4 + uBass);

  // Fine scanline glitches
  float fineSlice = floor(p.y * (60.0 + uTreb*100.0));
  float fineSeed = fract(sin(fineSlice*12.9898 + floor(uTime*9.0))*43758.5453);
  float fineJump = step(0.91 - uTreb*0.3, fineSeed) * (fineSeed-0.5) * 0.3;
  p.x += fineJump;

  // Wavy distortion driven by bass
  p.x += sin(p.y*5.0 + uTime*2.0) * 0.015 * uBass;

  // ---- LAYER 1: large grid of varied cells ----
  float gridScale1 = 5.0 + floor(uBass*2.0)*2.0;
  vec2 cell1 = floor(p * gridScale1);
  vec2 g1 = fract(p * gridScale1) - 0.5;
  float cellH1 = hash(cell1 + floor(uTime*2.5));
  // Different shape per cell: box, plus, ring
  float shape1;
  if(cellH1 < 0.4){
    shape1 = smoothstep(0.46, 0.42, max(abs(g1.x), abs(g1.y))); // box
  } else if(cellH1 < 0.75){
    shape1 = max(
      smoothstep(0.42, 0.38, abs(g1.x)) * step(abs(g1.y), 0.12),
      smoothstep(0.42, 0.38, abs(g1.y)) * step(abs(g1.x), 0.12)
    );
  } else {
    float r = length(g1);
    shape1 = smoothstep(0.42, 0.40, r) - smoothstep(0.34, 0.32, r); // ring
  }
  shape1 *= step(0.35, cellH1);

  // ---- LAYER 2: fine grid overlay — data dots ----
  float gridScale2 = 24.0;
  vec2 cell2 = floor(p * gridScale2);
  vec2 g2 = fract(p * gridScale2) - 0.5;
  float cellH2 = hash(cell2 + floor(uTime*4.0));
  float dots = smoothstep(0.18, 0.10, length(g2)) * step(0.78, cellH2);
  dots *= 0.4 + 0.6 * uBeatDecay;

  // ---- Chromatic split on shape1 ----
  float ofs = 0.005 + uBeatDecay*0.04;
  vec2 pr = p + vec2(ofs, 0);
  vec2 pb = p - vec2(ofs, 0);
  vec2 g1r = fract(pr * gridScale1) - 0.5;
  vec2 g1b = fract(pb * gridScale1) - 0.5;
  float shapeR = smoothstep(0.46, 0.42, max(abs(g1r.x), abs(g1r.y))) * step(0.35, cellH1);
  float shapeB = smoothstep(0.46, 0.42, max(abs(g1b.x), abs(g1b.y))) * step(0.35, cellH1);

  vec3 tint = pal(uTime*0.06 + cellH1*0.7);
  vec3 col = vec3(0.015);
  col.r = mix(col.r, tint.r, max(shape1, shapeR));
  col.g = mix(col.g, tint.g, shape1);
  col.b = mix(col.b, tint.b, max(shape1, shapeB));

  col += pal(0.6) * dots;

  // ---- Crosshair overlay that drifts ----
  vec2 crossPos = vec2(sin(uTime*0.3), cos(uTime*0.4)) * 0.4;
  vec2 cp = uv - crossPos;
  float crossLine = max(
    smoothstep(0.005, 0.003, abs(cp.x)),
    smoothstep(0.005, 0.003, abs(cp.y))
  );
  col += pal(0.2) * crossLine * 0.3 * (0.5 + uTreb);

  // ---- Beat ring ----
  float ring = smoothstep(0.32 + uBeatDecay*0.5, 0.30 + uBeatDecay*0.5, length(uv))
             - smoothstep(0.30 + uBeatDecay*0.5, 0.28 + uBeatDecay*0.5, length(uv));
  col += pal(uTime*0.2) * ring * uBeatDecay * 1.2;

  // CRT scanlines
  col *= 0.88 + 0.12 * sin(p.y * uRes.y * 0.7);

  return col;
}

// ============================================================
// SCENE: CIRCUIT BOARD — proper PCB with traces, vias, components
// ============================================================
vec3 sceneCircuit(vec2 uv){
  // Bigger cells = bigger circuit, more readable
  vec2 p = uv * 2.5;
  // Slow drift across the board
  p += vec2(uTime*0.08, uTime*0.05);

  vec2 cell = floor(p);
  vec2 q = fract(p) - 0.5;
  float h = hash(cell);

  // Each edge of the cell is either connected or not.
  // We use a hash of the EDGE position so neighbors agree.
  // Edge top is shared with cell+(0,1); edge right with cell+(1,0).
  float edgeT = step(0.40, hash(cell + vec2(0.0, 0.5)));
  float edgeR = step(0.40, hash(cell + vec2(0.5, 0.0)));
  float edgeB = step(0.40, hash(cell + vec2(0.0,-0.5)));
  float edgeL = step(0.40, hash(cell + vec2(-0.5,0.0)));

  float numConn = edgeT + edgeR + edgeB + edgeL;

  // Trace half-width
  float tw = 0.045;

  // Build trace segments: each goes from cell center (0,0) to edge midpoint
  // Vertical trace going up: x in [-tw, tw], y in [0, 0.5]
  // Distance from a horizontal strip: max(|x|-tw, max(-y, y-0.5))
  float tUp = max(abs(q.x) - tw, max(-q.y, q.y - 0.5));
  float tDn = max(abs(q.x) - tw, max( q.y, -q.y - 0.5));
  float tRt = max(abs(q.y) - tw, max(-q.x, q.x - 0.5));
  float tLt = max(abs(q.y) - tw, max( q.x, -q.x - 0.5));

  // Only include each if its edge is connected
  if(edgeT < 0.5) tUp = 1e9;
  if(edgeB < 0.5) tDn = 1e9;
  if(edgeR < 0.5) tRt = 1e9;
  if(edgeL < 0.5) tLt = 1e9;

  float traceSDF = min(min(tUp, tDn), min(tRt, tLt));
  float trace = smoothstep(0.005, 0.0, traceSDF);

  // Center pad (only if there are connections)
  float centerR = (numConn > 2.5) ? 0.11 : (numConn > 0.5 ? 0.07 : 0.0);
  float padOuter = smoothstep(centerR + 0.005, centerR, length(q));
  float padHole  = smoothstep(centerR - 0.045, centerR - 0.055, length(q));
  float pad = padOuter * (1.0 - padHole * 0.6);

  // ---- COMPONENTS in some cells ----
  float compH = hash(cell + 99.7);
  float comp = 0.0;
  vec3 compColor = vec3(0.0);

  // SMD resistor (small black rectangle with metal endcaps)
  if(compH > 0.78 && compH < 0.86 && numConn > 1.5){
    vec2 cq = q;
    float rectBody = max(abs(cq.x) - 0.18, abs(cq.y) - 0.07);
    float rectInside = smoothstep(0.005, 0.0, rectBody);
    float endL = smoothstep(0.005, 0.0, max(abs(cq.x + 0.20) - 0.04, abs(cq.y) - 0.08));
    float endR = smoothstep(0.005, 0.0, max(abs(cq.x - 0.20) - 0.04, abs(cq.y) - 0.08));
    comp = max(rectInside, max(endL, endR));
    compColor = mix(vec3(0.85, 0.80, 0.6), vec3(0.04, 0.03, 0.02), rectInside);
    if(endL + endR > 0.0) compColor = vec3(0.85, 0.80, 0.6);
  }
  // IC chip (dark square with notch)
  else if(compH > 0.86 && compH < 0.93){
    float chipBody = max(abs(q.x), abs(q.y)) - 0.28;
    float chipInside = smoothstep(0.005, 0.0, chipBody);
    comp = chipInside;
    compColor = vec3(0.10, 0.10, 0.12);
    // notch indicator
    float notch = length(q - vec2(-0.22, -0.22)) - 0.025;
    comp -= smoothstep(0.005, 0.0, notch) * 0.5;
    // tiny pin lines at edges
    float pinX = step(0.24, abs(q.x)) * step(abs(q.y), 0.22);
    float pinStripe = step(0.5, fract(q.y * 12.0));
    comp = max(comp, pinX * pinStripe * 0.3);
  }
  // LED — circular bright spot
  else if(compH > 0.93){
    float led = length(q) - 0.10;
    float ledInside = smoothstep(0.005, 0.0, led);
    comp = ledInside;
    compColor = pal(h * 0.8);  // colorful LED
  }

  // ---- ENERGY PULSE ----
  float pulseSpeed = 1.5 + uLevel*2.5;
  float pulseT = uTime * pulseSpeed;
  float pulseGlow = 0.0;
  if(edgeT > 0.5){
    float pp = fract(pulseT + h*3.7) * 0.5;
    pulseGlow += smoothstep(0.04, 0.0, length(q - vec2(0.0, pp))) * step(abs(q.x), tw*1.5);
  }
  if(edgeR > 0.5){
    float pp = fract(pulseT + h*3.7 + 0.25) * 0.5;
    pulseGlow += smoothstep(0.04, 0.0, length(q - vec2(pp, 0.0))) * step(abs(q.y), tw*1.5);
  }
  if(edgeB > 0.5){
    float pp = fract(pulseT + h*3.7 + 0.5) * 0.5;
    pulseGlow += smoothstep(0.04, 0.0, length(q - vec2(0.0, -pp))) * step(abs(q.x), tw*1.5);
  }
  if(edgeL > 0.5){
    float pp = fract(pulseT + h*3.7 + 0.75) * 0.5;
    pulseGlow += smoothstep(0.04, 0.0, length(q - vec2(-pp, 0.0))) * step(abs(q.y), tw*1.5);
  }
  pulseGlow *= (0.6 + uBeatDecay * 1.4);

  // ---- COMPOSE ----
  vec3 pcbGreen = vec3(0.025, 0.09, 0.045);
  // Subtle PCB texture / fiber pattern
  pcbGreen += vec3(0.005) * fbm(uv*30.0);

  vec3 traceColor = vec3(0.85, 0.65, 0.30);  // copper trace
  vec3 padColor   = vec3(1.0,  0.85, 0.45);  // gold pad
  vec3 pulseColor = pal(uTime*0.15 + h*0.5);

  vec3 col = pcbGreen;
  col = mix(col, traceColor, trace);
  col = mix(col, padColor, pad);
  col = mix(col, compColor, comp);
  col += pulseColor * pulseGlow * 1.4;

  // Tiny silkscreen labels (white dots near components)
  if(compH > 0.78){
    float dot1 = smoothstep(0.012, 0.008, length(q - vec2(0.32, 0.32)));
    col += vec3(0.6, 0.6, 0.55) * dot1 * 0.5;
  }

  // Vignette toward edges
  float vig = 1.0 - dot(uv, uv) * 0.25;
  col *= vig;

  return col;
}

// ============================================================
// SCENE: GLYPH STORM — falling/floating geometric symbols
// ============================================================
vec3 sceneGlyphs(vec2 uv){
  vec3 col = vec3(0.012);

  // Fall direction (slow drift)
  vec2 p = uv;
  p.y += uFwd * 0.7;

  // Multiple grid layers at different scales for parallax depth
  for(int layer = 0; layer < 3; layer++){
    float lf = float(layer);
    float scale = 5.0 + lf * 4.0;
    vec2 lp = p * scale;
    lp.y += lf * 0.7;
    vec2 cell = floor(lp);
    vec2 q = fract(lp) - 0.5;
    float h = hash(cell + lf*13.7);

    // Only draw glyph in some cells
    if(h > 0.65){
      // Pick glyph type
      float gType = floor(hash(cell + 99.1) * 5.0);
      float glyph;

      if(gType < 1.0){
        // Plus/cross
        glyph = max(
          smoothstep(0.32, 0.28, abs(q.x)) * step(abs(q.y), 0.10),
          smoothstep(0.32, 0.28, abs(q.y)) * step(abs(q.x), 0.10)
        );
      } else if(gType < 2.0){
        // Square outline
        float box = max(abs(q.x), abs(q.y));
        glyph = smoothstep(0.30, 0.28, box) - smoothstep(0.24, 0.22, box);
      } else if(gType < 3.0){
        // Triangle (rotated by hash)
        vec2 tq = q;
        float ang = floor(hash(cell+5.5)*4.0) * 1.5708;
        tq *= rot(ang);
        float tri = max(tq.y, max(-tq.y - tq.x*1.7, -tq.y + tq.x*1.7)) - 0.18;
        glyph = smoothstep(0.04, 0.0, tri);
      } else if(gType < 4.0){
        // Concentric dot
        float r = length(q);
        glyph = smoothstep(0.10, 0.07, r) + (smoothstep(0.30, 0.27, r) - smoothstep(0.24, 0.21, r))*0.7;
      } else {
        // X / cross
        vec2 xq = q;
        xq *= rot(0.7854);
        glyph = max(
          smoothstep(0.28, 0.26, abs(xq.x)) * step(abs(xq.y), 0.06),
          smoothstep(0.28, 0.26, abs(xq.y)) * step(abs(xq.x), 0.06)
        );
      }

      // Brightness depth — closer layer brighter
      float depth = (3.0 - lf) / 3.0;
      // Twinkle on beat / random flicker
      float flicker = 0.7 + 0.3 * sin(uTime*4.0 + h*30.0) + uBeatDecay * 0.6 * step(0.5, hash(cell+uTime));
      vec3 tint = pal(h*0.6 + uTime*0.04 + lf*0.2);
      col += tint * glyph * depth * flicker * (0.4 + uMid*0.3);
    }
  }

  return col;
}

// ============================================================
// SCENE: IRIS LENS — dense grid of iridescent concentric-ring lenses
// over a teal/purple/amber chromatic gradient backdrop. Inspired by
// the bubble-glass reference: each cell is a small embossed lens with
// chromatic fringing, the whole field drifts and pulses with bass.
// ============================================================
vec3 sceneIris(vec2 uv){
  // Slow diagonal chromatic gradient backdrop (teal → purple → amber).
  // The gradient itself drifts with mid-band so the hue sheet moves with
  // the melody, not just the grid.
  float gAng = uv.x * 0.9 + uv.y * 0.6 + uTime * 0.05 + uMid*0.6;
  float gradT = 0.5 + 0.5 * sin(gAng * 1.3 + sin(uv.y*2.2 + uTime*0.12)*0.35);
  vec3 teal   = vec3(0.38, 0.90, 0.92);
  vec3 purple = vec3(0.40, 0.28, 0.68);
  vec3 amber  = vec3(1.00, 0.72, 0.32);
  vec3 bg = (gradT < 0.5)
    ? mix(teal, purple, smoothstep(0.0, 0.5, gradT))
    : mix(purple, amber, smoothstep(0.5, 1.0, gradT));

  // Dense lens grid — density pumps with bass (more lenses during drops)
  vec2 p = uv * (6.2 + uBass*1.1);
  p += vec2(uTime*0.16, uTime*0.10);
  float row = floor(p.y);
  float rowShift = mod(row, 2.0) * 0.5;
  vec2 cellId = vec2(floor(p.x - rowShift), row);
  vec2 q = vec2(fract(p.x - rowShift) - 0.5, fract(p.y) - 0.5);

  float h  = hash(cellId);
  float h2 = hash(cellId + 7.1);

  float r = length(q);
  // Concentric rings — bass WIDENS the ring spacing (slow pulse),
  // treble speeds the phase sweep (fast shimmer), beats ripple outward.
  float ringFreq = 22.0 + h*10.0 - uBass*10.0;
  float ringPhase = -uTime*(1.6 + uTreb*2.5) - h*TAU + uBeatDecay*6.0;
  float rings = 0.5 + 0.5 * sin(r * ringFreq + ringPhase);

  // Lens disk — radius itself pulses on beats so lenses visibly swell
  float lensR = 0.48 + uBeatDecay*0.06;
  float disk   = smoothstep(lensR, lensR - 0.04, r);
  float groove = smoothstep(lensR + 0.02, lensR, r);

  // Chromatic fringe widens on beats
  float caOff = 0.006 + uBeatDecay*0.020 + uBass*0.008;
  float rR = length(q - vec2(caOff, 0.0));
  float rB = length(q + vec2(caOff, 0.0));
  float ringR = 0.5 + 0.5 * sin(rR * ringFreq + ringPhase);
  float ringB = 0.5 + 0.5 * sin(rB * ringFreq + ringPhase);
  vec3 iri = vec3(ringR, rings, ringB);

  // Embossed highlight — light direction sweeps with time so the emboss
  // shifts around each lens rather than sitting statically.
  float lAng = uTime*0.25 + uMid*1.5;
  vec2 L = vec2(cos(lAng), sin(lAng));
  float spec = pow(max(0.0, dot(normalize(q + vec2(1e-4)), L)), 3.2);
  spec *= disk;

  vec3 col = bg * 0.80;
  col = mix(col, col * (0.45 + iri * 1.25), disk * 0.92);
  col += vec3(1.0) * spec * (0.45 + uMid*0.45);
  col *= mix(0.55, 1.0, groove);

  // Per-lens sparkle — more twinkles on hi-hats, bass lets more through
  float sparkle = step(0.92 - uBass*0.1, h2) * smoothstep(0.08, 0.0, r);
  col += vec3(1.05, 1.0, 0.95) * sparkle * (0.35 + uTreb*1.0 + uBeatDecay*0.5);

  col *= 1.0 - dot(uv, uv) * 0.22;
  return col;
}

// ============================================================
// LAYER OVERLAYS — additive-only variants of glyph + iris, composited
// on top of whatever primary scene is active. No background, no
// vignette, just the highlight contribution so between symbols/rings
// the overlay is fully transparent.
// ============================================================
vec3 layerGlyphs(vec2 uv){
  vec3 col = vec3(0.0);
  vec2 p = uv;
  p.y += uFwd * 0.7;

  for(int layer = 0; layer < 2; layer++){  // 2 layers (vs 3) — lighter overlay
    float lf = float(layer);
    float scale = 6.0 + lf * 5.0;
    vec2 lp = p * scale;
    lp.y += lf * 0.7;
    vec2 cell = floor(lp);
    vec2 q = fract(lp) - 0.5;
    float h = hash(cell + lf*13.7);

    // Sparser than primary — only ~20% of cells fire
    if(h > 0.78){
      float gType = floor(hash(cell + 99.1) * 5.0);
      float glyph;
      if(gType < 1.0){
        glyph = max(
          smoothstep(0.32, 0.28, abs(q.x)) * step(abs(q.y), 0.10),
          smoothstep(0.32, 0.28, abs(q.y)) * step(abs(q.x), 0.10)
        );
      } else if(gType < 2.0){
        float box = max(abs(q.x), abs(q.y));
        glyph = smoothstep(0.30, 0.28, box) - smoothstep(0.24, 0.22, box);
      } else if(gType < 3.0){
        vec2 tq = q;
        float ang = floor(hash(cell+5.5)*4.0) * 1.5708;
        tq *= rot(ang);
        float tri = max(tq.y, max(-tq.y - tq.x*1.7, -tq.y + tq.x*1.7)) - 0.18;
        glyph = smoothstep(0.04, 0.0, tri);
      } else if(gType < 4.0){
        float r = length(q);
        glyph = smoothstep(0.10, 0.07, r) + (smoothstep(0.30, 0.27, r) - smoothstep(0.24, 0.21, r))*0.7;
      } else {
        vec2 xq = q;
        xq *= rot(0.7854);
        glyph = max(
          smoothstep(0.28, 0.26, abs(xq.x)) * step(abs(xq.y), 0.06),
          smoothstep(0.28, 0.26, abs(xq.y)) * step(abs(xq.x), 0.06)
        );
      }
      float depth = (2.0 - lf) / 2.0;
      // Harsher flicker — most frames the glyph is dim, treble/beats spike it
      float flicker = 0.3 + 0.2 * sin(uTime*5.0 + h*30.0) + uBeatDecay * 0.9 * step(0.5, hash(cell+uTime));
      vec3 tint = pal(h*0.6 + uTime*0.04 + lf*0.2);
      col += tint * glyph * depth * flicker;
    }
  }
  return col;
}

vec3 layerIris(vec2 uv){
  // Sparse lens grid with heavy morph + color variation:
  //   - whole field rotates and swirls
  //   - each lens picks 2 of 4 pattern types (rings, spokes, spiral,
  //     rose petals) and continuously crossfades between them
  //   - aspect ratio pulses each lens between circle and ellipse
  //   - per-lens palette walker for live color cycling
  //   - outer halo band in a complementary hue for extra depth
  float fieldAng = uTime * 0.08 + uBass * 0.3;
  vec2 sp = uv * rot(fieldAng);

  // Swirl: outer radii twist opposite to inner
  float rWorld = length(uv) + 0.001;
  float swirl = sin(rWorld * 3.0 - uTime * 0.6);
  sp *= rot(swirl * 0.25);

  float scale = 3.2 + 0.8 * sin(uTime*0.11) + uBass * 1.0;
  vec2 p = sp * scale;
  p += vec2(sin(uTime*0.22)*1.2, cos(uTime*0.17)*0.9) + uTime*0.08;

  float row = floor(p.y);
  float rowShift = mod(row, 2.0) * 0.5;
  vec2 cellId = vec2(floor(p.x - rowShift), row);
  vec2 q = vec2(fract(p.x - rowShift) - 0.5, fract(p.y) - 0.5);

  float h  = hash(cellId);
  float h2 = hash(cellId + 7.1);
  float h3 = hash(cellId + 13.3);

  // Only ~30% of cells get a lens
  if(h < 0.70) return vec3(0.0);

  // Per-lens spin
  q *= rot(uTime * (0.6 + h*1.2) + h * TAU);

  // ASPECT PULSE — oscillate ellipse so lenses squash/stretch
  float aspect = 1.0 + 0.45 * sin(uTime * 0.7 + h3 * TAU);
  q.x *= aspect;
  q.y /= aspect;

  float r = length(q);
  float ang = atan(q.y, q.x);

  // Per-lens type cycle: typeIdx walks 0..4 slowly, h3 staggers cells
  // so neighbors aren't synchronised. typeMix is the crossfade between
  // the integer pattern and the next one.
  float typeIdx = mod(uTime*0.10 + h3*4.0, 4.0);
  float t1f = floor(typeIdx);
  float typeMix = typeIdx - t1f;
  int t1 = int(t1f);
  int t2 = int(mod(t1f + 1.0, 4.0));

  // PATTERN 0 — concentric rings (the classic iris look)
  float ringFreq = 16.0 + h*10.0 + 4.0 * sin(uTime*0.4 + h*TAU);
  float ringPhase = -uTime*(1.8 + uTreb*2.5) - h*TAU + uBeatDecay*6.0;
  float pat0 = smoothstep(0.82, 0.96, 0.5 + 0.5 * sin(r * ringFreq + ringPhase));

  // PATTERN 1 — radial spokes
  float spokes = floor(4.0 + h*8.0);
  float pat1 = smoothstep(0.86, 0.97, 0.5 + 0.5 * sin(ang * spokes + uTime*1.4));

  // PATTERN 2 — spiral (rings + angle)
  float pat2 = smoothstep(0.82, 0.96, 0.5 + 0.5 * sin(r * ringFreq + ang * 5.0 + ringPhase));

  // PATTERN 3 — rose / petals
  float petals = floor(3.0 + h*4.0);
  float roseR  = abs(cos(ang * petals + uTime*0.5));
  float pat3   = smoothstep(0.05, 0.0, abs(r - roseR*0.40));

  // Select the two active patterns via weights (avoids dynamic indexing)
  float w0_1 = (t1==0) ? 1.0 : 0.0;
  float w1_1 = (t1==1) ? 1.0 : 0.0;
  float w2_1 = (t1==2) ? 1.0 : 0.0;
  float w3_1 = (t1==3) ? 1.0 : 0.0;
  float w0_2 = (t2==0) ? 1.0 : 0.0;
  float w1_2 = (t2==1) ? 1.0 : 0.0;
  float w2_2 = (t2==2) ? 1.0 : 0.0;
  float w3_2 = (t2==3) ? 1.0 : 0.0;
  float patA = pat0*w0_1 + pat1*w1_1 + pat2*w2_1 + pat3*w3_1;
  float patB = pat0*w0_2 + pat1*w1_2 + pat2*w2_2 + pat3*w3_2;
  float pattern = mix(patA, patB, typeMix);

  // Lens radius breathes
  float lensR = 0.38 + 0.06*sin(uTime*0.8 + h*TAU) + uMid*0.08 + uBeatDecay*0.06;
  float mask = smoothstep(lensR, lensR - 0.05, r);

  // PALETTE WALKER — each lens cycles through the palette over time,
  // with a per-cell phase offset so neighbors are different colors.
  vec3 paletteCol = pal(uTime*0.13 + h*0.6 + r*0.4 + h3*0.3);

  vec3 col = paletteCol * pattern * mask;

  // Chromatic fringe — applied via a separate ring contribution so
  // the pattern still has RGB separation on its edges, but only when
  // the active pattern is ring-like (pat0 or pat2 weighted).
  float ringWeight = (w0_1 + w2_1)*(1.0 - typeMix) + (w0_2 + w2_2)*typeMix;
  if(ringWeight > 0.05){
    float caOff = 0.005 + uBeatDecay*0.022 + uBass*0.006;
    float ringR = smoothstep(0.82, 0.96, 0.5 + 0.5 * sin(length(q - vec2(caOff,0.0)) * ringFreq + ringPhase));
    float ringB = smoothstep(0.82, 0.96, 0.5 + 0.5 * sin(length(q + vec2(caOff,0.0)) * ringFreq + ringPhase));
    vec3 fringe = vec3(ringR, pat0, ringB) * mask;
    col = mix(col, col + fringe * 0.45, ringWeight);
  }

  // OUTER HALO — soft band beyond the lens edge, complementary palette
  float haloOuter = lensR + 0.18;
  float haloBand = smoothstep(haloOuter, lensR + 0.02, r) * smoothstep(lensR, haloOuter, r);
  vec3 haloCol = pal(uTime*0.07 + h*0.4 + 0.45);
  col += haloCol * haloBand * (0.30 + uMid*0.50 + uBeatDecay*0.30);

  // Sparkle core — wobbling bright points on treble/beats
  vec2 sq = q + vec2(sin(uTime*2.0 + h*TAU), cos(uTime*1.7 + h*TAU)) * 0.04;
  float sparkle = step(0.85 - uBass*0.10, h2) * smoothstep(0.06, 0.0, length(sq));
  col += vec3(1.05, 1.0, 0.95) * sparkle * (0.30 + uTreb*1.0 + uBeatDecay*0.6);
  return col;
}

// Render a single scene (A or B) without any SDF morph — used when we
// still need a "pure" scene render (e.g. rendering just the 3D side
// during a glitch-involving transition, or during steady-state play).
vec3 renderScene(vec2 uv, vec2 zuv, int sIdx){
  if(sIdx == 4) return sceneGlitch(zuv);        // glitch is 2D
  return raymarch3D(uv, sIdx, sIdx, 0.0);       // single-scene raymarch
}

// Render a geometric A↔B morph in one raymarch pass. Requires both
// scenes to be 3D SDFs — caller guarantees sA != 4 && sB != 4.
vec3 renderSceneMorph(vec2 uv, int sA, int sB, float t){
  return raymarch3D(uv, sA, sB, t);
}

void main(){
  vec2 fragUV = gl_FragCoord.xy / uRes.xy;
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes.xy) / min(uRes.x, uRes.y);
  vec2 zuv = uv * uZoom * 1.4;
  zuv *= rot(uRotY);

  int sA = int(uSceneA + 0.5);
  int sB = int(uSceneB + 0.5);

  // ============= SCENE RENDER / MORPH =============
  // Two transition paths:
  //   1) 3D ↔ 3D  → one raymarch pass with geometric mix(sdfA, sdfB, t).
  //      Shapes from A literally deform into shapes from B — seamless.
  //   2) Any scene ↔ glitch (2D, no SDF) → fall back to the old noise-
  //      dissolve crossfade since we can't SDF-morph against a 2D scene.
  vec3 col;
  bool transitioning = uSceneMix > 0.001 && sA != sB;
  bool glitchInvolved = transitioning && (sA == 4 || sB == 4);

  if(transitioning && !glitchInvolved){
    // Geometric morph in a single raymarch
    col = renderSceneMorph(uv, sA, sB, uSceneMix);
  } else if(transitioning && glitchInvolved){
    // Noise-dissolve crossfade (A + B rendered separately)
    vec3 colA = renderScene(uv, zuv, sA);
    vec3 colB = renderScene(uv, zuv, sB);
    float dis = fbm(uv * 3.0 + uTime * 0.4);
    float bias = uSceneMix * 1.35 - 0.15;
    float dissolve = smoothstep(bias - 0.25, bias + 0.25, dis);
    float mixAmt = mix(uSceneMix, dissolve, 0.6);
    col = mix(colA, colB, mixAmt);
  } else {
    // Steady state — single scene, no mix
    col = renderScene(uv, zuv, sA);
  }

  // ============= OVERLAY LAYERS =============
  // Glyph + iris come and go rather than sit ever-present. Each layer
  // has a slow sinusoidal presence envelope (clamped to 0) so it fades
  // in, hangs briefly, fades out — invisible for most of each cycle.
  // The two cycles are phase-offset so they rarely share the frame.
  // Still gated off during glitch (sA==4) so that scene reads clean.
  float overlayGate = (sA == 4) ? 0.0 : 1.0;
  // Glyph presence: ~24s cycle, peak ~6s then dark — strict clamp to 0
  float glyphPulse = max(0.0, sin(uTime * 0.26) - 0.45) / 0.55; // 0..1 window
  col += layerGlyphs(zuv) * glyphPulse * (0.6 + uTreb * 0.7 + uBeatDecay * 0.4) * overlayGate;
  // Iris presence: ~32s cycle, offset so it rarely overlaps glyphs
  float irisPulse = max(0.0, sin(uTime * 0.20 + 2.4) - 0.45) / 0.55;
  col += layerIris(zuv) * irisPulse * (0.55 + uBeatDecay * 0.8 + uMid * 0.25) * overlayGate;

  // ============= SHARED ATMOSPHERE LAYER =============
  // Rendered above the scene so it persists across crossfades — ties the
  // whole feed together visually regardless of which scene is active.

  // 1) Radial bass bloom — warm center pulse that expands with bass
  float atmDist = length(uv);
  float atm = exp(-atmDist * 1.6) * (0.04 + uBass*0.28 + uBeatDecay*0.10);
  col += pal(uTime*0.04 + 0.5) * atm;

  // 2) Procedural dust sparkles — tied to treble; respond instantly to hi-hats
  vec2 dustCoord = gl_FragCoord.xy * 0.028;
  vec2 dustI = floor(dustCoord + vec2(uTime*5.0, uTime*3.5));
  float dustH = fract(sin(dot(dustI, vec2(91.1, 43.7))) * 43758.5453);
  vec2 dustF = fract(dustCoord + vec2(uTime*5.0, uTime*3.5)) - 0.5;
  float sparkMask = step(0.972 - uTreb*0.04, dustH);
  float sparkShape = smoothstep(0.32, 0.0, length(dustF));
  col += pal(dustH + uTime*0.1) * sparkMask * sparkShape * (0.35 + uTreb*1.2 + uBeatDecay*0.4);

  // 3) Horizontal scan pulse — subtle bar sweeps down on strong beats
  // (use x*x instead of pow(x,2.0) — pow(negative, non-int) is NaN on some GPUs)
  float scanY = fract(uTime * 0.35);
  float scanDy = (fragUV.y - scanY) * 12.0;
  float scan = exp(-scanDy * scanDy) * uBeatDecay * 0.25;
  col += pal(uTime*0.06 + 0.2) * scan;

  vec2 fc = fragUV - 0.5;
  float zoom = 1.0 - 0.005 - uBass*0.010 - uBeatDecay*0.012;
  fc *= zoom;
  fc *= rot(uWarp + uMid*0.004);
  fc += vec2(sin(fragUV.y*8.0 + uTime), cos(fragUV.x*8.0 + uTime*1.2)) * (0.002 + uTreb*0.004);
  vec2 prevUV = fc + 0.5;

  // Feedback with per-channel offset for a subtle RGB smear in the trails.
  // Lowered — was accumulating fringe artifacts every frame.
  float caT = 0.0008 + uBeatDecay*0.002;
  vec3 prev;
  prev.r = texture2D(uPrev, prevUV + vec2(caT, 0)).r;
  prev.g = texture2D(uPrev, prevUV).g;
  prev.b = texture2D(uPrev, prevUV - vec2(caT, 0)).b;

  // Soft-decay trails: multiplicative feedback with luminance-based limiter
  // Prevents runaway buildup while keeping highlight persistence
  prev *= uFeedback;
  float prevLum = dot(prev, vec3(0.299, 0.587, 0.114));
  prev *= 1.0 - smoothstep(0.9, 1.3, prevLum) * 0.5;

  // Screen-like blend preserves HDR headroom (bloom can still pick up highlights)
  col = col + prev * 0.55 - col * prev * 0.20;

  // Beat punch — inverted color flash on strong beats
  col = mix(col, 1.0 - col, uBeat * 0.22);

  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
`;

const brightUniforms = { uTex:{value:null}, uThresh:{value:0.75}, uRes:{value:new THREE.Vector2()} };
const brightMat = new THREE.ShaderMaterial({
  uniforms: brightUniforms,
  vertexShader: 'void main(){gl_Position=vec4(position,1.);}',
  fragmentShader: `
    precision highp float;
    uniform sampler2D uTex; uniform float uThresh; uniform vec2 uRes;
    // Soft-knee threshold (Karis/COD-style) — smoother bloom onset than step()
    void main(){
      vec2 uv = gl_FragCoord.xy / uRes.xy;
      vec3 c = texture2D(uTex, uv).rgb;
      float brightness = max(max(c.r, c.g), c.b);
      float knee = 0.25;
      float soft = brightness - uThresh + knee;
      soft = clamp(soft, 0.0, 2.0*knee);
      soft = soft * soft / (4.0 * knee + 0.0001);
      float contribution = max(soft, brightness - uThresh) / max(brightness, 0.0001);
      // Karis average — weight by inverse luminance to stop fireflies
      float lum = dot(c, vec3(0.299, 0.587, 0.114));
      float weight = 1.0 / (1.0 + lum);
      gl_FragColor = vec4(c * contribution * weight * 1.4, 1.0);
    }
  `
});

const blurUniforms = { uTex:{value:null}, uRes:{value:new THREE.Vector2()}, uDir:{value:new THREE.Vector2(1,0)} };
const blurMat = new THREE.ShaderMaterial({

  vertexShader: 'void main(){gl_Position=vec4(position,1.);}',
  fragmentShader: `

      c += texture2D(uTex, uv + 1.0*px).rgb * 0.15;
      c += texture2D(uTex, uv + 2.0*px).rgb * 0.12;
      c += texture2D(uTex, uv + 3.0*px).rgb * 0.09;

const compUniforms = {
  uMain:{value:null}, uBloom:{value:null}, uBloom2:{value:null},
  uRes:{value:new THREE.Vector2()},
  uTime:{value:0}, uBeat:{value:0}, uBass:{value:0}, uMid:{value:0},
  uTreb:{value:0},
  uKAmount:{value:0},  // smoothed kaleidoscope amount, set from JS
};
const compMat = new THREE.ShaderMaterial({
  uniforms: compUniforms,
  vertexShader: 'void main(){gl_Position=vec4(position,1.);}',
  fragmentShader: `
    precision highp float;
    uniform sampler2D uMain, uBloom, uBloom2;
    uniform vec2 uRes;
    uniform float uTime, uBeat, uBass, uMid, uTreb, uKAmount;

    const float PI = 3.14159265359;
    const float TAU = 6.28318530718;

    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }

    vec3 aces(vec3 x){
      const float a = 2.51;
      const float b = 0.03;
      const float c = 2.43;
      const float d = 0.59;
      const float e = 0.14;
      return clamp((x * (a*x + b)) / (x * (c*x + d) + e), 0.0, 1.0);
    }

    mat2 rot(float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c); }

    // Kaleidoscope fold — n-fold radial symmetry
    vec2 kaleido(vec2 p, float n){
      float a = atan(p.y, p.x);
      float r = length(p);
      float seg = TAU / n;
      a = mod(a, seg);
      a = abs(a - seg * 0.5);
      return vec2(cos(a), sin(a)) * r;
    }

    void main(){
      vec2 uv = gl_FragCoord.xy / uRes.xy;
      vec2 cuv = uv - 0.5;

      // Sample original visual with subtle chromatic aberration. Kept low
      // so it doesn't amplify silhouette aliasing into RGB stair-steps.
      float ca = 0.0006 + uBass*0.0018 + uBeat*0.004;
      vec2 dir = cuv * 2.0;
      vec3 mainOrig;
      mainOrig.r = texture2D(uMain, uv + dir*ca).r;
      mainOrig.g = texture2D(uMain, uv).g;
      mainOrig.b = texture2D(uMain, uv - dir*ca).b;

      // ===== LOCAL UNIFORMITY DETECTION =====
      // Sample 4 nearby pixels to detect if this region is uniform.
      // No readback needed — runs entirely on GPU per pixel.
      float sampleR = 0.04; // sample radius in UV space
      vec3 cN = texture2D(uMain, uv + vec2(0.0,  sampleR)).rgb;
      vec3 cS = texture2D(uMain, uv + vec2(0.0, -sampleR)).rgb;
      vec3 cE = texture2D(uMain, uv + vec2( sampleR, 0.0)).rgb;
      vec3 cW = texture2D(uMain, uv + vec2(-sampleR, 0.0)).rgb;
      vec3 mean = (cN + cS + cE + cW + mainOrig) * 0.2;
      float localVar = length(cN - mean) + length(cS - mean) + length(cE - mean) + length(cW - mean);
      // Only trigger if the pixel is also bright (dark areas should stay dark, not kaleido)
      float meanBright = dot(mean, vec3(0.299, 0.587, 0.114));
      // Local kaleidoscope amount — gentle ramp
      float k = (1.0 - smoothstep(0.0, 0.06, localVar)) * smoothstep(0.1, 0.3, meanBright);
      k *= 0.5; // overall strength cap

      // Kaleidoscope sample from the same texture — picks up the visual's own colors
      vec3 mainK = mainOrig;
      if(k > 0.005){
        vec2 kp = cuv * 1.2;
        kp *= rot(uTime*0.15);
        float folds = 6.0;
        kp = kaleido(kp, folds);
        vec2 kSampleUV = clamp(kp + 0.5, 0.02, 0.98);
        mainK.r = texture2D(uMain, kSampleUV + dir*ca*0.5).r;
        mainK.g = texture2D(uMain, kSampleUV).g;
        mainK.b = texture2D(uMain, kSampleUV - dir*ca*0.5).b;
      }

      vec3 main = mix(mainOrig, mainK, k);

      // Bloom — mix two mips for a broader, more filmic glow
      vec3 bloomNear = texture2D(uBloom,  uv).rgb;
      vec3 bloomFar  = texture2D(uBloom2, uv).rgb;
      vec3 bloom = bloomNear * 0.40 + bloomFar * 0.55;
      vec3 col = main + bloom * (0.28 + uMid*0.18 + uBeat*0.12);

      // Subtle color grade: gentle teal/orange split
      vec3 shadowTint    = vec3(0.88, 0.95, 1.08);   // cool shadows
      vec3 highlightTint = vec3(1.08, 0.98, 0.88);   // warm highlights
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      float mixAmt = smoothstep(0.0, 0.7, lum);
      col *= mix(shadowTint, highlightTint, mixAmt);

      // Smooth vignette — gentle falloff from center to corners
      float vigDist = length(cuv) * 1.6;
      float vig = 1.0 - smoothstep(0.55, 1.15, vigDist);
      col *= mix(0.55, 1.0, vig);

      // Exposure + ACES tone mapping
      float exposure = 1.05 + uBeat * 0.15;
      col = aces(col * exposure);

      // Saturation boost — palette colors pop without clipping
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(vec3(l), col, 1.18);

      // Dithered grain — uses time-animated hash, amount tied to luminance
      // so shadows dither more (where banding shows) and highlights stay clean
      float g = hash(gl_FragCoord.xy + fract(uTime) * 73.0);
      float grainAmt = mix(0.03, 0.015, smoothstep(0.0, 0.4, l));
      col += (g - 0.5) * grainAmt;

      // Light gamma for richer mids
      col = pow(max(col, 0.0), vec3(0.94));

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

function diag(msg){
  const ts = new Date().toISOString().substr(14, 8);

  if(diagEnabled && diagEl){

}

function setupAnalyser(node){
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = fftSize;
  // Higher = more temporal smoothing inside the analyser itself
  analyser.smoothingTimeConstant = 0.85;

async function startMic(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') await audioCtx.resume();
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast('mic not supported on this browser');
      return;
    }
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }});
    sourceNode = audioCtx.createMediaStreamSource(micStream);
    setupAnalyser(sourceNode);
    hideStart();
    setMode('mic input');
    toast('mic active');
    isPaused = false;
    updatePlayPauseIcon();
  } catch(e){
    if(e.name === 'NotAllowedError'){
      toast('mic blocked: enable in safari settings');
      // Open settings hint
      setTimeout(()=>toast('settings → safari → microphone'), 2200);
    } else if(e.name === 'NotFoundError'){
      toast('no microphone found');
    } else {
      toast('mic error: ' + (e.name || 'unknown'));
    }
    console.error(e);
  }
}

// Pending file waiting for explicit user-gesture play (iOS unlock)
let pendingFile = null;
let bufferSource = null;
let decodedBuffer = null;
let playStartTime = 0;
let playOffset = 0;
let gainNode = null;
// Pre-computed amplitude peaks used by the timeline waveform UI.
let wavePeaks = null;

function startFile(file){
  diag('startFile enter');
  if(!file){ toast('no file selected'); return; }
  // No MIME-type gate — iOS returns empty types for many files. Let the
  // decoder decide. Errors surface in the diag panel.
  try { stopAllPlayback(); } catch(e){ diag('stopAll err: ' + e.message); }
  pendingFile = file;
  try { setMode((file.name || 'audio').slice(0, 22)); } catch(_){}
  try { hideStart(); } catch(e){ diag('hideStart err: ' + e.message); }
  try { showPlayOverlay(); } catch(e){ diag('showOverlay err: ' + e.message); }
  isPaused = false;
  try { updatePlayPauseIcon(); } catch(_){}
  diag('OVERLAY SHOWN — tap screen to play');
}

function stopAllPlayback(){
  if(mediaEl){ try{ mediaEl.pause(); mediaEl.remove(); }catch(_){} mediaEl = null; }
  if(bufferSource){ try{ bufferSource.onended = null; bufferSource.stop(); bufferSource.disconnect(); }catch(_){} bufferSource = null; }
  if(sourceNode){ try{ sourceNode.disconnect(); }catch(_){} sourceNode = null; }
  if(analyser){ try{ analyser.disconnect(); }catch(_){} analyser = null; }
  if(gainNode){ try{ gainNode.disconnect(); }catch(_){} gainNode = null; }
  decodedBuffer = null;
  wavePeaks = null;
  hideTimeline();
}

// Called from a real user gesture (tap on play overlay)
async function actuallyStartPlayback(){
  diag('overlay tapped');
  if(!pendingFile){ diag('no pendingFile'); return; }

  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  } catch(e){
    diag('ctx create err: ' + e.message);
    toast('audio not supported');
    return;
  }

  diag('ctx state pre-resume: ' + audioCtx.state);
  if(audioCtx.state === 'suspended'){
    try { await audioCtx.resume(); diag('ctx resumed'); } catch(e){ diag('resume err: ' + e.message); }
  }

  // CRITICAL: play a silent buffer immediately to fully unlock iOS audio output
  try {
    const silentBuf = audioCtx.createBuffer(1, 1, 22050);
    const silentSrc = audioCtx.createBufferSource();
    silentSrc.buffer = silentBuf;
    silentSrc.connect(audioCtx.destination);
    silentSrc.start(0);
  } catch(e){ console.warn('silent unlock failed', e); }

  toast('decoding...');
  diag('reading ' + (pendingFile.size || 0) + 'b');

  let arrayBuffer;
  try {
    arrayBuffer = await pendingFile.arrayBuffer();
    diag('read ok: ' + arrayBuffer.byteLength + 'b');
  } catch(e){
    diag('read err: ' + e.message);
    toast('cant read file');
    return;
  }

  try {
    decodedBuffer = await new Promise((resolve, reject) => {
      const p = audioCtx.decodeAudioData(arrayBuffer, resolve, reject);
      if(p && p.then) p.then(resolve, reject);
    });
    diag('decoded ' + decodedBuffer.duration.toFixed(1) + 's');
  } catch(e){
    diag('decode err: ' + ((e && e.message) || e));
    toast('cant decode: try wav or different mp3');
    return;
  }

  try {
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = fftSize;
    analyser.smoothingTimeConstant = 0.85;

    gainNode = audioCtx.createGain();
    gainNode.gain.value = 1.0;
    gainNode.connect(audioCtx.destination);

    playOffset = 0;
    startBufferSourceAt(0);

    // Pre-compute waveform peaks and reveal the timeline UI.
    wavePeaks = computePeaks(decodedBuffer, 420);
    showTimeline();

    hidePlayOverlay();
    diag('playing');
    toast('playing · ' + (pendingFile.name || '').slice(0, 18));
  } catch(e){
    diag('playback err: ' + e.message);
    toast('playback failed');
  }
}

// Spin up a fresh BufferSource starting at `offsetSec`. Re-used by seek().
function startBufferSourceAt(offsetSec){
  if(!audioCtx || !decodedBuffer || !analyser || !gainNode) return;
  if(bufferSource){
    try { bufferSource.onended = null; bufferSource.stop(); bufferSource.disconnect(); } catch(_){}
  }
  const clamped = Math.max(0, Math.min(decodedBuffer.duration - 0.01, offsetSec));
  bufferSource = audioCtx.createBufferSource();
  bufferSource.buffer = decodedBuffer;
  bufferSource.loop = true;
  bufferSource.connect(analyser);
  bufferSource.connect(gainNode);
  bufferSource.start(0, clamped);
  playOffset = clamped;
  playStartTime = audioCtx.currentTime;
}

function formatTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' + s : s);
}

// Max-abs amplitude per bucket; returns Float32Array length=numBuckets.
function computePeaks(buffer, numBuckets){
  const ch = buffer.getChannelData(0);
  const step = Math.max(1, Math.floor(ch.length / numBuckets));
  const peaks = new Float32Array(numBuckets);
  let max = 0;
  for(let i = 0; i < numBuckets; i++){
    const start = i * step;
    const end = Math.min(ch.length, start + step);
    let lo = 0, hi = 0;
    for(let j = start; j < end; j++){
      const v = ch[j];
      if(v > hi) hi = v;
      else if(v < lo) lo = v;
    }
    const amp = Math.max(hi, -lo);
    peaks[i] = amp;
    if(amp > max) max = amp;
  }
  // Normalize so the loudest peak fills the bar.
  if(max > 0.0001){
    for(let i = 0; i < numBuckets; i++) peaks[i] /= max;
  }
  return peaks;
}

function currentPlayPosition(){
  if(!decodedBuffer) return 0;
  if(scrubbing) return scrubFrac * decodedBuffer.duration;
  if(!audioCtx || isPaused) return playOffset;
  const t = playOffset + (audioCtx.currentTime - playStartTime);
  return t % decodedBuffer.duration;
}

function drawWaveform(){
  if(!waveCtx || !waveCanvas || !wavePeaks || !decodedBuffer) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cssW = waveCanvas.clientWidth | 0;
  const cssH = waveCanvas.clientHeight | 0;
  if(cssW < 2 || cssH < 2) return;
  const wantW = Math.floor(cssW * dpr);
  const wantH = Math.floor(cssH * dpr);
  if(waveCanvas.width !== wantW || waveCanvas.height !== wantH){
    waveCanvas.width = wantW;
    waveCanvas.height = wantH;
  }
  const W = waveCanvas.width, H = waveCanvas.height;
  waveCtx.clearRect(0, 0, W, H);

  const n = wavePeaks.length;
  const barW = W / n;
  const gap = Math.max(1, Math.floor(dpr));
  const midY = H / 2;
  const frac = Math.max(0, Math.min(1, currentPlayPosition() / decodedBuffer.duration));
  const playX = frac * W;

  // Waveform bars — bright paper up to playhead, dimmed paper beyond.
  for(let i = 0; i < n; i++){
    const x = i * barW;
    const cx = x + barW * 0.5;
    const amp = wavePeaks[i];
    // Floor so very quiet sections still show a hairline.
    const h = Math.max(dpr, amp * (H - dpr * 2));
    const played = cx <= playX;
    waveCtx.fillStyle = played ? 'rgba(242,239,230,0.95)' : 'rgba(242,239,230,0.30)';
    waveCtx.fillRect(Math.floor(x), Math.floor(midY - h/2),
                     Math.max(1, Math.floor(barW - gap)), Math.ceil(h));
  }

  // Playhead line.
  waveCtx.fillStyle = '#ffffff';
  waveCtx.fillRect(Math.max(0, Math.floor(playX) - 1), 0, Math.max(1, Math.floor(dpr)) + 1, H);
}

function seek(toSec){
  if(!decodedBuffer) return;
  const clamped = Math.max(0, Math.min(decodedBuffer.duration - 0.02, toSec));
  if(!audioCtx) return;
  startBufferSourceAt(clamped);
  if(isPaused){
    // Resume — scrubbing implies playback.
    audioCtx.resume().catch(()=>{});
    isPaused = false;
    updatePlayPauseIcon();
  }
}

// Pointer scrubbing — desktop + touch unified via Pointer Events.
if(waveCanvas){
  const fracFromEvent = (e) => {
    const r = waveCanvas.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - r.left) / Math.max(1, r.width)));
  };
  waveCanvas.addEventListener('pointerdown', (e) => {
    if(!decodedBuffer) return;
    e.preventDefault();
    waveCanvas.setPointerCapture(e.pointerId);
    scrubbing = true;
    scrubFrac = fracFromEvent(e);
    bump();
  });
  waveCanvas.addEventListener('pointermove', (e) => {
    if(!scrubbing) return;
    scrubFrac = fracFromEvent(e);
  });
  const endScrub = (e) => {
    if(!scrubbing) return;
    scrubbing = false;
    try { waveCanvas.releasePointerCapture(e.pointerId); } catch(_){}
    if(decodedBuffer){
      seek(scrubFrac * decodedBuffer.duration);
    }
    bump();
  };
  waveCanvas.addEventListener('pointerup', endScrub);
  waveCanvas.addEventListener('pointercancel', endScrub);
  // Block double-tap zoom on mobile when tapping the scrub bar.
  waveCanvas.addEventListener('dblclick', (e) => e.preventDefault());
}

function readAudio(dt){
  if(!analyser) return;
  analyser.getByteFrequencyData(freqData);
  const N = freqData.length;
  let b=0,m=0,t=0,bN=0,mN=0,tN=0;
  for(let i=0;i<N;i++){
    const v = freqData[i]/255;
    const r = i/N;
    if(r<0.06){b+=v;bN++;} else if(r<0.3){m+=v;mN++;} else {t+=v;tN++;}
  }
  b/=Math.max(1,bN); m/=Math.max(1,mN); t/=Math.max(1,tN);
  const lvl = (b+m+t)/3;

  // Two-stage smoothing with attack/release envelopes
  // Stage 1: raw -> smoothed (fast attack, medium release)
  function envelope(prev, target, attackRate, releaseRate, dt){
    const rate = target > prev ? attackRate : releaseRate;
    const k = 1 - Math.exp(-dt * rate);
    return prev + (target - prev) * k;
  }
  smoothed.bass  = envelope(smoothed.bass,  b,   18, 4, dt);
  smoothed.mid   = envelope(smoothed.mid,   m,   16, 5, dt);
  smoothed.treb  = envelope(smoothed.treb,  t,   20, 6, dt);
  smoothed.level = envelope(smoothed.level, lvl, 12, 3, dt);

  // Stage 2: smoothed -> visual (slow second pass kills jitter completely)
  const visK = 1 - Math.exp(-dt * 8);
  visual.bass  += (smoothed.bass  - visual.bass)  * visK;
  visual.mid   += (smoothed.mid   - visual.mid)   * visK;
  visual.treb  += (smoothed.treb  - visual.treb)  * visK;
  visual.level += (smoothed.level - visual.level) * visK;

  bassHist.shift(); bassHist.push(b);
  const avg = bassHist.reduce((s,x)=>s+x,0) / bassHist.length;
  const variance = bassHist.reduce((s,x)=>s+(x-avg)*(x-avg),0) / bassHist.length;
  const C = -0.0025714 * variance + 1.5142857;
  const isBeat = b > avg*C && b > 0.18 && (performance.now()-lastBeatT)>200;
  if(isBeat){ beatEnv = 1; lastBeatT = performance.now(); }
  else beatEnv *= Math.pow(0.0015, dt); // slower beat decay too
}
