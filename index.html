<style>
  :root {

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #000; color: var(--paper);

.start {
position: fixed; inset: 0; z-index: 30;
display: flex; flex-direction: column; align-items: center; justify-content: center;

padding: env(safe-area-inset-top, 24px) 24px env(safe-area-inset-bottom, 24px);

.start.hidden { opacity: 0; pointer-events: none; transform: scale(1.02); }

font-family: 'Times New Roman', serif;
font-weight: 400; font-size: clamp(48px, 12vw, 84px);

.start h1 em { color: var(--accent); font-style: italic; }
.start .tag { font-size: 10px; letter-spacing: 0.4em; text-transform: uppercase; color: var(--muted); margin-bottom: 56px; }
.actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
.action {
background: transparent; color: var(--paper);
border: 1px solid var(--paper); padding: 18px 20px;
font-family: 'Courier New', monospace; font-size: 12px;
letter-spacing: 0.28em; text-transform: uppercase;
cursor: pointer; transition: all 0.15s ease; text-align: left;
display: flex; align-items: center; justify-content: space-between;
}
.action:hover, .action:active { background: var(--paper); color: var(--ink); }
.action.primary { border-color: var(--accent); color: var(--accent); }
.action.primary:hover, .action.primary:active { background: var(--accent); color: var(--ink); }
.action svg { width: 14px; height: 14px; }
.hint { margin-top: 32px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); text-align: center; line-height: 1.8; }

input[type=file] {
  position: absolute; left: -10000px; top: auto; width: 1px; height: 1px;

}

.hud { position: fixed; inset: 0; pointer-events: none; z-index: 10;

.ctrl svg { width: 18px; height: 18px; stroke-width: 1.6; }

.x { position: fixed; width: 12px; height: 12px; opacity: 0.35; z-index: 5; pointer-events: none; transition: opacity 0.5s; }
.x::before, .x::after { content: ''; position: absolute; background: var(--paper); }
.x::before { width: 12px; height: 1px; top: 0; }
.x::after { width: 1px; height: 12px; left: 0; }
.x.tl { top: 8px; left: 8px; }
.x.tr { top: 8px; right: 8px; transform: scaleX(-1); }
.x.bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
.x.br { bottom: 8px; right: 8px; transform: scale(-1,-1); }

.toast { position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%) translateY(8px);
background: rgba(0,0,0,0.85); border: 1px solid var(--accent); color: var(--accent);

@keyframes pulseFade { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }

.drop { position: fixed; inset: 16px; border: 2px dashed var(--accent); z-index: 28;
display: none; align-items: center; justify-content: center;

/* Play overlay (iOS audio unlock) */
#playOverlay {
position: fixed; inset: 0; z-index: 35;

50%      { transform: scale(1.05); box-shadow: 0 0 0 18px rgba(255,52,34,0); }

.play-label {
font-family: 'Times New Roman', serif; font-style: italic; font-size: 28px; color: var(--paper);

font-size: 9px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted);

position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 99999;

pointer-events: none;

<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const W = () => Math.floor(window.innerWidth  * Math.min(window.devicePixelRatio, 2));
const H = () => Math.floor(window.innerHeight * Math.min(window.devicePixelRatio, 2));

const camFs = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const sceneFs = new THREE.Scene();
const quadGeo = new THREE.PlaneGeometry(2,2);

function makeRT(w, h){
  return new THREE.WebGLRenderTarget(Math.max(2,Math.floor(w)), Math.max(2,Math.floor(h)), {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    type: THREE.HalfFloatType, format: THREE.RGBAFormat
  });
}
let rtMain = makeRT(W(), H());
let rtPrev = makeRT(W(), H());
let rtBloomA = makeRT(W()/2, H()/2);
let rtBloomB = makeRT(W()/2, H()/2);
let rtBloomC = makeRT(W()/4, H()/4);
let rtBloomD = makeRT(W()/4, H()/4);

const mainUniforms = {
  uTime:{value:0}, uRes:{value:new THREE.Vector2()},
  uBass:{value:0}, uMid:{value:0}, uTreb:{value:0}, uLevel:{value:0},
  uBeat:{value:0}, uBeatDecay:{value:0},
  // Dual-scene crossfade: uSceneMix 0 = pure A, 1 = pure B, interp between.
  uSceneA:{value:0}, uSceneB:{value:0}, uSceneMix:{value:0},
  uHue:{value:0},
  uPrev:{value:null}, uFeedback:{value:0.92}, uWarp:{value:0.004},
  uPalette:{value:0}, uZoom:{value:1.0},
  uRotX:{value:0}, uRotY:{value:0},
  // Accumulated forward-flight position. Incremented smoothly in JS every
  // frame so the scene fly-through never jerks with audio level.
  uFwd:{value:0},
};

const mainFrag = `
precision highp float;

uniform vec2  uRes;
uniform float uTime, uBass, uMid, uTreb, uLevel, uBeat, uBeatDecay, uFwd;
uniform float uSceneA, uSceneB, uSceneMix;
uniform float uHue, uFeedback, uWarp, uPalette, uZoom;
uniform float uRotX, uRotY;
uniform sampler2D uPrev;

const float PI = 3.14159265359;
const float TAU = 6.28318530718;

vec3 cosPal(float t, vec3 a, vec3 b, vec3 c, vec3 d){ return a + b*cos(TAU*(c*t+d)); }
vec3 pal(float t){
  int p = int(uPalette + 0.5);
  if(p == 0) return cosPal(t, vec3(0.55,0.40,0.50), vec3(0.55,0.55,0.50), vec3(1,1,0.9), vec3(0.0,0.2+uHue*0.4,0.55));
  if(p == 1) return cosPal(t, vec3(0.5),           vec3(0.5),           vec3(1,0.7,0.4), vec3(0.0,0.15,0.20));
  if(p == 2) return cosPal(t, vec3(0.8,0.5,0.4),   vec3(0.2,0.4,0.2),   vec3(2,1,1),     vec3(0.0,0.25,0.25));
  if(p == 3) return cosPal(t, vec3(0.5),           vec3(0.5),           vec3(2,1,0),     vec3(0.5,0.2,0.25));
  if(p == 4) return cosPal(t, vec3(0.6,0.4,0.7),   vec3(0.4,0.4,0.4),   vec3(1,1,2),     vec3(0,0.1,0.2));
  // Palette 5: NEON CYBERPUNK — magenta/pink shifting to cyan
  return cosPal(t, vec3(0.5, 0.3, 0.6), vec3(0.6, 0.5, 0.5), vec3(1.0, 0.7, 0.5), vec3(0.95, 0.5, 0.2));
}

mat2 rot(float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  float a=hash(i), b=hash(i+vec2(1,0)), c=hash(i+vec2(0,1)), d=hash(i+vec2(1,1));
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){ float v=0., a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.0; a*=0.5;} return v; }

float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }
float sdOct(vec3 p, float s){ p=abs(p); return (p.x+p.y+p.z-s)*0.57735; }
float sdTorus(vec3 p, vec2 t){ vec2 q=vec2(length(p.xz)-t.x,p.y); return length(q)-t.y; }
float sdSphere(vec3 p, float r){ return length(p)-r; }
float sdCross(vec3 p, float s){
  float a = sdBox(p, vec3(s, s*0.2, s*0.2));
  float b = sdBox(p, vec3(s*0.2, s, s*0.2));
  float c = sdBox(p, vec3(s*0.2, s*0.2, s));
  return min(min(a,b),c);
}
float smin(float a,float b,float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }

vec2 kaleido(vec2 p, float n){
  float a=atan(p.y,p.x), r=length(p), seg=TAU/n;
  a=mod(a,seg); a=abs(a-seg*0.5);
  return vec2(cos(a),sin(a))*r;
}

float mapLattice(vec3 p){
  // Smooth forward fly-through via JS-accumulated uFwd (no audio jerk).
  // Shape warping still reacts to bass — "music moves the shapes".
  p.z += uFwd * 1.0;
  p.xz *= rot(uTime*0.04 + uBass*0.20);
  p.xy *= rot(uTime*0.02);

  float CELL = 1.4;
  vec3 cellId = floor((p + CELL*0.5) / CELL);
  vec3 q1 = mod(p + CELL*0.5, CELL) - CELL*0.5;
  float cellH = fract(sin(dot(cellId, vec3(127.1, 311.7, 74.7)))*43758.5453);

  // Shape size pumps strongly with bass; beats punch it further
  float shapeSize = 0.20 + cellH * 0.14 + uBass * 0.24 + uBeatDecay * 0.08;
  float oct = sdOct(q1, shapeSize);

  // Connecting struts — thin square cross-section bars along axes
  // Use absolute coordinates within the cell
  vec3 ap = abs(q1);
  float STRUT = 0.035;
  // Each strut is a "box bar" extending along one axis through cell center
  float strutX = max(ap.y, ap.z) - STRUT;
  float strutY = max(ap.x, ap.z) - STRUT;
  float strutZ = max(ap.x, ap.y) - STRUT;
  float struts = min(min(strutX, strutY), strutZ);

  // Smooth union of shape + struts
  float d = smin(oct, struts, 0.06);
  return d;
}

float mapPlasma(vec3 p){
  p.z += uFwd * 0.9;
  p.x += sin(uTime*0.15) * 0.4;
  p.y += cos(uTime*0.12) * 0.3;

  p.xz *= rot(uTime*0.04 + uBass*0.15);
  p.xy *= rot(uTime*0.02 + uMid*0.08);

  // Two scales of crosses, well-spaced
  vec3 q1 = mod(p + 1.0, 2.0) - 1.0;
  vec3 q2 = mod(p + 0.35, 0.7) - 0.35;

  float c1 = sdCross(q1, 0.22 + 0.18*uBass + 0.08*uBeatDecay);
  float c2 = sdCross(q2, 0.08 + 0.06*uMid  + 0.03*uBeatDecay);

  float d = smin(c1, c2, 0.04);
  return d;
}

// VOXEL CLUSTER — flythrough a sparse field of architectural cubes
float mapVoxels(vec3 p){
  p.z += uFwd * 1.25;
  p.xz *= rot(uTime*0.05 + uBass*0.10);
  p.xy *= rot(uTime*0.02);

  float CELL = 1.4;
  vec3 cellId = floor((p + CELL*0.5) / CELL);
  vec3 q = mod(p + CELL*0.5, CELL) - CELL*0.5;

  float h1 = fract(sin(dot(cellId, vec3(127.1, 311.7, 74.7)))*43758.5453);
  float h2 = fract(sin(dot(cellId, vec3(91.7, 217.3, 51.1)))*43758.5453);

  float existence = smoothstep(0.50, 0.65, h1);

  // Cube size now visibly pumps with bass + beats
  float vSize = (0.20 + h2 * 0.30 + uBass * 0.16 + uBeatDecay * 0.08) * existence;
  vSize = max(vSize, 0.001);

  return sdBox(q, vec3(vSize));
}

// CRYSTAL FIELD — scattered octahedral crystals in a flythrough
float mapCrystals(vec3 p){
  p.z += uFwd * 1.75;
  p.xz *= rot(uTime*0.04 + uBass*0.12);

  float CELL = 1.0;
  vec2 cellId = floor((p.xy + CELL*0.5) / CELL);
  vec2 q = mod(p.xy + CELL*0.5, CELL) - CELL*0.5;

  float h1 = fract(sin(dot(cellId, vec2(127.1, 311.7)))*43758.5453);
  float h2 = fract(sin(dot(cellId, vec2(91.7, 217.3)))*43758.5453);

  float zOffset = h2 * 4.0;
  float zPos = mod(p.z + zOffset, 4.0) - 2.0;

  float existence = smoothstep(0.20, 0.40, h1);
  // Crystals grow strongly with bass, pop on beats
  float crysSize = (0.20 + h1 * 0.18 + uBass * 0.14 + uBeatDecay * 0.07) * existence;
  crysSize = max(crysSize, 0.001);

  return sdOct(vec3(q.x, q.y, zPos), crysSize);
}

// Unified scene SDF dispatcher — used by collision detection too
float sceneSDF(vec3 p, int sIdx){
  if(sIdx==0)      return mapLattice(p);
  else if(sIdx==1) return mapPlasma(p);
  else if(sIdx==2) return mapVoxels(p);
  else             return mapCrystals(p);
}

vec3 calcNormal(vec3 p, int sIdx){
  // Tetrahedral gradient — 4 taps, slightly more stable than 3-tap fwd diff
  const float e = 0.0015;
  vec2 k = vec2(1.0, -1.0);
  return normalize(
    k.xyy * sceneSDF(p + k.xyy*e, sIdx) +
    k.yyx * sceneSDF(p + k.yyx*e, sIdx) +
    k.yxy * sceneSDF(p + k.yxy*e, sIdx) +
    k.xxx * sceneSDF(p + k.xxx*e, sIdx)
  );
}

// 5-tap occlusion sampler — queries SDF along the normal for proper AO
float calcAO(vec3 p, vec3 n, int sIdx){
  float occ = 0.0;
  float sca = 1.0;
  for(int i=0; i<5; i++){
    float h = 0.02 + 0.08 * float(i);
    float d = sceneSDF(p + n*h, sIdx);
    occ += (h - d) * sca;
    sca *= 0.75;
  }
  return clamp(1.0 - 1.2*occ, 0.0, 1.0);
}

// Cheap soft shadow via SDF min-distance penumbra
float softShadow(vec3 ro, vec3 rd, int sIdx){
  float res = 1.0;
  float t = 0.02;
  for(int i=0; i<14; i++){
    float h = sceneSDF(ro + rd*t, sIdx);
    if(h < 0.001) return 0.0;
    res = min(res, 10.0*h/t);
    t += clamp(h, 0.04, 0.35);
    if(t > 6.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

vec3 raymarch3D(vec2 uv, int sIdx){
  // Per-scene camera distance
  float baseDist = 4.0;
  if(sIdx == 0) baseDist = 4.0;       // lattice
  else if(sIdx == 1) baseDist = 4.0;  // cross temple
  else if(sIdx == 2) baseDist = 4.0;  // voxels
  else               baseDist = 3.0;  // crystals
  float dist = baseDist * uZoom;

  vec3 ro = vec3(0.0, 0.0, -dist);

  vec3 rd = normalize(vec3(uv, 1.5));

  // ---- USER ROTATION (drives the flight path) ----
  ro.xz *= rot(uRotY);
  rd.xz *= rot(uRotY);
  ro.yz *= rot(uRotX);
  rd.yz *= rot(uRotX);

  // ===== CAMERA COLLISION =====
  // Push the camera back along its outward direction until it has clearance.
  float CLEARANCE = 0.35;
  vec3 outward = normalize(ro);
  for(int i = 0; i < 8; i++){
    float d = sceneSDF(ro, sIdx);
    if(d >= CLEARANCE) break;
    ro += outward * (CLEARANCE - d + 0.01);
  }

  float t = 0.0;
  float dmin = 999.0;
  vec3 col = vec3(0.0);
  bool hit = false;
  vec3 hitP;
  int steps = 0;
  for(int i=0; i<128; i++){
    vec3 p = ro + rd*t;
    float d = sceneSDF(p, sIdx);
    dmin = min(dmin, d);
    // Tight relative epsilon — sharper silhouettes, less stair-step alias
    float eps = 0.0005 + t * 0.00025;
    if(d < eps){ hit = true; hitP = p; steps = i; break; }
    if(t > 18.0) break;
    // Slightly conservative step — reduces "skip past thin feature" misses
    // that show up as ragged edges on struts/crystal points
    t += d * 0.65;
    steps = i;
  }

  // ===== SILHOUETTE COVERAGE (analytic AA via dmin) =====
  // dmin = closest the march got to a surface. For a definite hit dmin is
  // tiny; for a near-miss it's small but non-zero. Map it to a 0..1 coverage
  // so silhouette edges fade smoothly into background instead of stair-stepping.
  float aaW = 0.004 + 0.0035 * t;        // soft-edge width grows with distance
  float coverage = 1.0 - smoothstep(0.0, aaW, dmin);

  if(hit){
    vec3 n = calcNormal(hitP, sIdx);
    vec3 v = -rd;

    // Two-light rig: warm key + cool fill
    vec3 keyDir  = normalize(vec3(0.55, 0.85, -0.6));
    vec3 fillDir = normalize(vec3(-0.7, 0.15, -0.4));
    vec3 keyCol  = vec3(1.05, 0.95, 0.82);
    vec3 fillCol = vec3(0.55, 0.70, 1.10);

    float ndotK = max(0.0, dot(n, keyDir));
    float ndotF = max(0.0, dot(n, fillDir));

    // Soft shadow only from the key — fill stays unshadowed
    float sh = softShadow(hitP + n*0.01, keyDir, sIdx);
    sh = mix(0.4, 1.0, sh);

    float ao = calcAO(hitP, n, sIdx);

    // Blinn-Phong specular for a tighter highlight
    vec3 hK = normalize(keyDir + v);
    float specK = pow(max(0.0, dot(n, hK)), 64.0) * sh;
    vec3 hF = normalize(fillDir + v);
    float specF = pow(max(0.0, dot(n, hF)), 24.0) * 0.4;

    // Palette-driven surface color, animated by position + bass
    float pt = t*0.06 + n.x*0.25 + n.y*0.18 + uTime*0.04 + uBass*0.3;
    vec3 base = pal(pt);
    vec3 rim  = pal(pt + 0.5);

    // Lambert diffuse from two lights
    vec3 diffuse  = base * keyCol  * ndotK * sh * 0.75;
    diffuse      += base * fillCol * ndotF       * 0.35;
    // Ambient from palette so shadows stay colored, not black
    vec3 ambient  = base * vec3(0.12, 0.14, 0.18) * ao;

    col = diffuse * ao + ambient;
    col += rim * (specK + specF) * (0.5 + uTreb*0.5);

    // Fresnel rim — stronger on grazing angles, tinted by complementary palette
    float fres = pow(1.0 - max(0.0, dot(n, v)), 3.5);
    col += pal(pt + 0.3) * fres * (0.25 + uMid*0.5);

    // ===== NEAR-CLIP FADE =====
    // Narrow window — fade only when almost touching surface
    float nearFade = smoothstep(0.0, 0.35, t);
    col *= nearFade;

    // ===== DISTANCE FOG =====
    // Tinted fog using a slowly shifting palette color — adds depth + mood
    vec3 fogCol = pal(uTime*0.03 + 0.6) * 0.35;
    float fogAmt = 1.0 - exp(-t * 0.11);
    col = mix(col, fogCol, fogAmt * 0.55);
    // Apply silhouette coverage so the hit color fades to 0 at the edge
    // instead of dropping to background in one pixel.
    col *= coverage;
  }
  // Volumetric glow from near-misses — stronger on mid/treb for beat-sync feel
  float glow = exp(-dmin*3.5) * (0.18 + uMid*0.35 + uTreb*0.15);
  col += pal(uTime*0.07 + 0.4) * glow * 0.35;
  return col;
}

// ============================================================
// SCENE: GLITCH FIELD — multilayered data display, less repetitive
// ============================================================
vec3 sceneGlitch(vec2 uv){
  vec2 p = uv;

  // Macro slice glitches at irregular intervals
  float bigSlice = floor(p.y * (12.0 + uMid*8.0));
  float bigSeed = fract(sin(bigSlice*45.21 + floor(uTime*1.7))*43758.5453);
  float bigJump = step(0.82, bigSeed) * (bigSeed-0.5) * 0.5;
  p.x += bigJump * (0.4 + uBass);

  // Fine scanline glitches
  float fineSlice = floor(p.y * (60.0 + uTreb*100.0));
  float fineSeed = fract(sin(fineSlice*12.9898 + floor(uTime*9.0))*43758.5453);
  float fineJump = step(0.91 - uTreb*0.3, fineSeed) * (fineSeed-0.5) * 0.3;
  p.x += fineJump;

  // Wavy distortion driven by bass
  p.x += sin(p.y*5.0 + uTime*2.0) * 0.015 * uBass;

  // ---- LAYER 1: large grid of varied cells ----
  float gridScale1 = 5.0 + floor(uBass*2.0)*2.0;
  vec2 cell1 = floor(p * gridScale1);
  vec2 g1 = fract(p * gridScale1) - 0.5;
  float cellH1 = hash(cell1 + floor(uTime*2.5));
  // Different shape per cell: box, plus, ring
  float shape1;
  if(cellH1 < 0.4){
    shape1 = smoothstep(0.46, 0.42, max(abs(g1.x), abs(g1.y))); // box
  } else if(cellH1 < 0.75){
    shape1 = max(
      smoothstep(0.42, 0.38, abs(g1.x)) * step(abs(g1.y), 0.12),
      smoothstep(0.42, 0.38, abs(g1.y)) * step(abs(g1.x), 0.12)
    );
  } else {
    float r = length(g1);
    shape1 = smoothstep(0.42, 0.40, r) - smoothstep(0.34, 0.32, r); // ring
  }
  shape1 *= step(0.35, cellH1);

  // ---- LAYER 2: fine grid overlay — data dots ----
  float gridScale2 = 24.0;
  vec2 cell2 = floor(p * gridScale2);
  vec2 g2 = fract(p * gridScale2) - 0.5;
  float cellH2 = hash(cell2 + floor(uTime*4.0));
  float dots = smoothstep(0.18, 0.10, length(g2)) * step(0.78, cellH2);
  dots *= 0.4 + 0.6 * uBeatDecay;

  // ---- Chromatic split on shape1 ----
  float ofs = 0.005 + uBeatDecay*0.04;
  vec2 pr = p + vec2(ofs, 0);
  vec2 pb = p - vec2(ofs, 0);
  vec2 g1r = fract(pr * gridScale1) - 0.5;
  vec2 g1b = fract(pb * gridScale1) - 0.5;
  float shapeR = smoothstep(0.46, 0.42, max(abs(g1r.x), abs(g1r.y))) * step(0.35, cellH1);
  float shapeB = smoothstep(0.46, 0.42, max(abs(g1b.x), abs(g1b.y))) * step(0.35, cellH1);

  vec3 tint = pal(uTime*0.06 + cellH1*0.7);
  vec3 col = vec3(0.015);
  col.r = mix(col.r, tint.r, max(shape1, shapeR));
  col.g = mix(col.g, tint.g, shape1);
  col.b = mix(col.b, tint.b, max(shape1, shapeB));

  col += pal(0.6) * dots;

  // ---- Crosshair overlay that drifts ----
  vec2 crossPos = vec2(sin(uTime*0.3), cos(uTime*0.4)) * 0.4;
  vec2 cp = uv - crossPos;
  float crossLine = max(
    smoothstep(0.005, 0.003, abs(cp.x)),
    smoothstep(0.005, 0.003, abs(cp.y))
  );
  col += pal(0.2) * crossLine * 0.3 * (0.5 + uTreb);

  // ---- Beat ring ----
  float ring = smoothstep(0.32 + uBeatDecay*0.5, 0.30 + uBeatDecay*0.5, length(uv))
             - smoothstep(0.30 + uBeatDecay*0.5, 0.28 + uBeatDecay*0.5, length(uv));
  col += pal(uTime*0.2) * ring * uBeatDecay * 1.2;

  // CRT scanlines
  col *= 0.88 + 0.12 * sin(p.y * uRes.y * 0.7);

  return col;
}

// ============================================================
// SCENE: CIRCUIT BOARD — proper PCB with traces, vias, components
// ============================================================
vec3 sceneCircuit(vec2 uv){
  // Bigger cells = bigger circuit, more readable
  vec2 p = uv * 2.5;
  // Slow drift across the board
  p += vec2(uTime*0.08, uTime*0.05);

  vec2 cell = floor(p);
  vec2 q = fract(p) - 0.5;
  float h = hash(cell);

  // Each edge of the cell is either connected or not.
  // We use a hash of the EDGE position so neighbors agree.
  // Edge top is shared with cell+(0,1); edge right with cell+(1,0).
  float edgeT = step(0.40, hash(cell + vec2(0.0, 0.5)));
  float edgeR = step(0.40, hash(cell + vec2(0.5, 0.0)));
  float edgeB = step(0.40, hash(cell + vec2(0.0,-0.5)));
  float edgeL = step(0.40, hash(cell + vec2(-0.5,0.0)));

  float numConn = edgeT + edgeR + edgeB + edgeL;

  // Trace half-width
  float tw = 0.045;

  // Build trace segments: each goes from cell center (0,0) to edge midpoint
  // Vertical trace going up: x in [-tw, tw], y in [0, 0.5]
  // Distance from a horizontal strip: max(|x|-tw, max(-y, y-0.5))
  float tUp = max(abs(q.x) - tw, max(-q.y, q.y - 0.5));
  float tDn = max(abs(q.x) - tw, max( q.y, -q.y - 0.5));
  float tRt = max(abs(q.y) - tw, max(-q.x, q.x - 0.5));
  float tLt = max(abs(q.y) - tw, max( q.x, -q.x - 0.5));

  // Only include each if its edge is connected
  if(edgeT < 0.5) tUp = 1e9;
  if(edgeB < 0.5) tDn = 1e9;
  if(edgeR < 0.5) tRt = 1e9;
  if(edgeL < 0.5) tLt = 1e9;

  float traceSDF = min(min(tUp, tDn), min(tRt, tLt));
  float trace = smoothstep(0.005, 0.0, traceSDF);

  // Center pad (only if there are connections)
  float centerR = (numConn > 2.5) ? 0.11 : (numConn > 0.5 ? 0.07 : 0.0);
  float padOuter = smoothstep(centerR + 0.005, centerR, length(q));
  float padHole  = smoothstep(centerR - 0.045, centerR - 0.055, length(q));
  float pad = padOuter * (1.0 - padHole * 0.6);

  // ---- COMPONENTS in some cells ----
  float compH = hash(cell + 99.7);
  float comp = 0.0;
  vec3 compColor = vec3(0.0);

  // SMD resistor (small black rectangle with metal endcaps)
  if(compH > 0.78 && compH < 0.86 && numConn > 1.5){
    vec2 cq = q;
    float rectBody = max(abs(cq.x) - 0.18, abs(cq.y) - 0.07);
    float rectInside = smoothstep(0.005, 0.0, rectBody);
    float endL = smoothstep(0.005, 0.0, max(abs(cq.x + 0.20) - 0.04, abs(cq.y) - 0.08));
    float endR = smoothstep(0.005, 0.0, max(abs(cq.x - 0.20) - 0.04, abs(cq.y) - 0.08));
    comp = max(rectInside, max(endL, endR));
    compColor = mix(vec3(0.85, 0.80, 0.6), vec3(0.04, 0.03, 0.02), rectInside);
    if(endL + endR > 0.0) compColor = vec3(0.85, 0.80, 0.6);
  }
  // IC chip (dark square with notch)
  else if(compH > 0.86 && compH < 0.93){
    float chipBody = max(abs(q.x), abs(q.y)) - 0.28;
    float chipInside = smoothstep(0.005, 0.0, chipBody);
    comp = chipInside;
    compColor = vec3(0.10, 0.10, 0.12);
    // notch indicator
    float notch = length(q - vec2(-0.22, -0.22)) - 0.025;
    comp -= smoothstep(0.005, 0.0, notch) * 0.5;
    // tiny pin lines at edges
    float pinX = step(0.24, abs(q.x)) * step(abs(q.y), 0.22);
    float pinStripe = step(0.5, fract(q.y * 12.0));
    comp = max(comp, pinX * pinStripe * 0.3);
  }
  // LED — circular bright spot
  else if(compH > 0.93){
    float led = length(q) - 0.10;
    float ledInside = smoothstep(0.005, 0.0, led);
    comp = ledInside;
    compColor = pal(h * 0.8);  // colorful LED
  }

  // ---- ENERGY PULSE ----
  float pulseSpeed = 1.5 + uLevel*2.5;
  float pulseT = uTime * pulseSpeed;
  float pulseGlow = 0.0;
  if(edgeT > 0.5){
    float pp = fract(pulseT + h*3.7) * 0.5;
    pulseGlow += smoothstep(0.04, 0.0, length(q - vec2(0.0, pp))) * step(abs(q.x), tw*1.5);
  }
  if(edgeR > 0.5){
    float pp = fract(pulseT + h*3.7 + 0.25) * 0.5;
    pulseGlow += smoothstep(0.04, 0.0, length(q - vec2(pp, 0.0))) * step(abs(q.y), tw*1.5);
  }
  if(edgeB > 0.5){
    float pp = fract(pulseT + h*3.7 + 0.5) * 0.5;
    pulseGlow += smoothstep(0.04, 0.0, length(q - vec2(0.0, -pp))) * step(abs(q.x), tw*1.5);
  }
  if(edgeL > 0.5){
    float pp = fract(pulseT + h*3.7 + 0.75) * 0.5;
    pulseGlow += smoothstep(0.04, 0.0, length(q - vec2(-pp, 0.0))) * step(abs(q.y), tw*1.5);
  }
  pulseGlow *= (0.6 + uBeatDecay * 1.4);

  // ---- COMPOSE ----
  vec3 pcbGreen = vec3(0.025, 0.09, 0.045);
  // Subtle PCB texture / fiber pattern
  pcbGreen += vec3(0.005) * fbm(uv*30.0);

  vec3 traceColor = vec3(0.85, 0.65, 0.30);  // copper trace
  vec3 padColor   = vec3(1.0,  0.85, 0.45);  // gold pad
  vec3 pulseColor = pal(uTime*0.15 + h*0.5);

  vec3 col = pcbGreen;
  col = mix(col, traceColor, trace);
  col = mix(col, padColor, pad);
  col = mix(col, compColor, comp);
  col += pulseColor * pulseGlow * 1.4;

  // Tiny silkscreen labels (white dots near components)
  if(compH > 0.78){
    float dot1 = smoothstep(0.012, 0.008, length(q - vec2(0.32, 0.32)));
    col += vec3(0.6, 0.6, 0.55) * dot1 * 0.5;
  }

  // Vignette toward edges
  float vig = 1.0 - dot(uv, uv) * 0.25;
  col *= vig;

  return col;
}

// ============================================================
// SCENE: GLYPH STORM — falling/floating geometric symbols
// ============================================================
vec3 sceneGlyphs(vec2 uv){
  vec3 col = vec3(0.012);

  // Fall direction (slow drift)
  vec2 p = uv;
  p.y += uFwd * 0.7;

  // Multiple grid layers at different scales for parallax depth
  for(int layer = 0; layer < 3; layer++){
    float lf = float(layer);
    float scale = 5.0 + lf * 4.0;
    vec2 lp = p * scale;
    lp.y += lf * 0.7;
    vec2 cell = floor(lp);
    vec2 q = fract(lp) - 0.5;
    float h = hash(cell + lf*13.7);

    // Only draw glyph in some cells
    if(h > 0.65){
      // Pick glyph type
      float gType = floor(hash(cell + 99.1) * 5.0);
      float glyph;

      if(gType < 1.0){
        // Plus/cross
        glyph = max(
          smoothstep(0.32, 0.28, abs(q.x)) * step(abs(q.y), 0.10),
          smoothstep(0.32, 0.28, abs(q.y)) * step(abs(q.x), 0.10)
        );
      } else if(gType < 2.0){
        // Square outline
        float box = max(abs(q.x), abs(q.y));
        glyph = smoothstep(0.30, 0.28, box) - smoothstep(0.24, 0.22, box);
      } else if(gType < 3.0){
        // Triangle (rotated by hash)
        vec2 tq = q;
        float ang = floor(hash(cell+5.5)*4.0) * 1.5708;
        tq *= rot(ang);
        float tri = max(tq.y, max(-tq.y - tq.x*1.7, -tq.y + tq.x*1.7)) - 0.18;
        glyph = smoothstep(0.04, 0.0, tri);
      } else if(gType < 4.0){
        // Concentric dot
        float r = length(q);
        glyph = smoothstep(0.10, 0.07, r) + (smoothstep(0.30, 0.27, r) - smoothstep(0.24, 0.21, r))*0.7;
      } else {
        // X / cross
        vec2 xq = q;
        xq *= rot(0.7854);
        glyph = max(
          smoothstep(0.28, 0.26, abs(xq.x)) * step(abs(xq.y), 0.06),
          smoothstep(0.28, 0.26, abs(xq.y)) * step(abs(xq.x), 0.06)
        );
      }

      // Brightness depth — closer layer brighter
      float depth = (3.0 - lf) / 3.0;
      // Twinkle on beat / random flicker
      float flicker = 0.7 + 0.3 * sin(uTime*4.0 + h*30.0) + uBeatDecay * 0.6 * step(0.5, hash(cell+uTime));
      vec3 tint = pal(h*0.6 + uTime*0.04 + lf*0.2);
      col += tint * glyph * depth * flicker * (0.4 + uMid*0.3);
    }
  }

  return col;
}

// Dispatches to the right scene. uv is centered/normalized; zuv is the
// zoomed/rotated uv used for the 2D patterns.
vec3 renderScene(vec2 uv, vec2 zuv, int sIdx){
  if(sIdx == 0)      return raymarch3D(uv, 0); // lattice
  else if(sIdx == 1) return raymarch3D(uv, 1); // cross temple
  else if(sIdx == 2) return raymarch3D(uv, 2); // voxels
  else if(sIdx == 3) return raymarch3D(uv, 3); // crystals
  else if(sIdx == 4) return sceneGlitch(zuv);
  else               return sceneGlyphs(zuv);
}

void main(){
  vec2 fragUV = gl_FragCoord.xy / uRes.xy;
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes.xy) / min(uRes.x, uRes.y);
  vec2 zuv = uv * uZoom * 1.4;
  zuv *= rot(uRotY);

  int sA = int(uSceneA + 0.5);
  int sB = int(uSceneB + 0.5);

  // Render A always. Render B only during a crossfade (uSceneMix > 0).
  vec3 col = renderScene(uv, zuv, sA);
  if(uSceneMix > 0.001){
    vec3 colB = renderScene(uv, zuv, sB);
    // Noise-dissolve mask adds organic texture to the crossfade — instead of
    // a flat lerp, patches of B reveal through A following a low-freq noise field.
    float dis = fbm(uv * 3.0 + uTime * 0.4);
    float bias = uSceneMix * 1.35 - 0.15;
    float dissolve = smoothstep(bias - 0.25, bias + 0.25, dis);
    // Blend the noise mask with a pure lerp so it feels organic but still
    // reaches 100% B at the end of the transition.
    float mixAmt = mix(uSceneMix, dissolve, 0.6);
    col = mix(col, colB, mixAmt);
  }

  // ============= SHARED ATMOSPHERE LAYER =============
  // Rendered above the scene so it persists across crossfades — ties the
  // whole feed together visually regardless of which scene is active.

  // 1) Radial bass bloom — warm center pulse that expands with bass
  float atmDist = length(uv);
  float atm = exp(-atmDist * 1.6) * (0.04 + uBass*0.28 + uBeatDecay*0.10);
  col += pal(uTime*0.04 + 0.5) * atm;

  // 2) Procedural dust sparkles — tied to treble; respond instantly to hi-hats
  vec2 dustCoord = gl_FragCoord.xy * 0.028;
  vec2 dustI = floor(dustCoord + vec2(uTime*5.0, uTime*3.5));
  float dustH = fract(sin(dot(dustI, vec2(91.1, 43.7))) * 43758.5453);
  vec2 dustF = fract(dustCoord + vec2(uTime*5.0, uTime*3.5)) - 0.5;
  float sparkMask = step(0.972 - uTreb*0.04, dustH);
  float sparkShape = smoothstep(0.32, 0.0, length(dustF));
  col += pal(dustH + uTime*0.1) * sparkMask * sparkShape * (0.35 + uTreb*1.2 + uBeatDecay*0.4);

  // 3) Horizontal scan pulse — subtle bar sweeps down on strong beats
  // (use x*x instead of pow(x,2.0) — pow(negative, non-int) is NaN on some GPUs)
  float scanY = fract(uTime * 0.35);
  float scanDy = (fragUV.y - scanY) * 12.0;
  float scan = exp(-scanDy * scanDy) * uBeatDecay * 0.25;
  col += pal(uTime*0.06 + 0.2) * scan;

  vec2 fc = fragUV - 0.5;
  float zoom = 1.0 - 0.005 - uBass*0.010 - uBeatDecay*0.012;
  fc *= zoom;
  fc *= rot(uWarp + uMid*0.004);
  fc += vec2(sin(fragUV.y*8.0 + uTime), cos(fragUV.x*8.0 + uTime*1.2)) * (0.002 + uTreb*0.004);
  vec2 prevUV = fc + 0.5;

  // Feedback with per-channel offset for a subtle RGB smear in the trails.
  // Lowered — was accumulating fringe artifacts every frame.
  float caT = 0.0008 + uBeatDecay*0.002;
  vec3 prev;
  prev.r = texture2D(uPrev, prevUV + vec2(caT, 0)).r;
  prev.g = texture2D(uPrev, prevUV).g;
  prev.b = texture2D(uPrev, prevUV - vec2(caT, 0)).b;

  // Soft-decay trails: multiplicative feedback with luminance-based limiter
  // Prevents runaway buildup while keeping highlight persistence
  prev *= uFeedback;
  float prevLum = dot(prev, vec3(0.299, 0.587, 0.114));
  prev *= 1.0 - smoothstep(0.9, 1.3, prevLum) * 0.5;

  // Screen-like blend preserves HDR headroom (bloom can still pick up highlights)
  col = col + prev * 0.55 - col * prev * 0.20;

  // Beat punch — inverted color flash on strong beats
  col = mix(col, 1.0 - col, uBeat * 0.22);

  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
`;

const mainMat = new THREE.ShaderMaterial({ uniforms: mainUniforms, vertexShader: 'void main(){gl_Position=vec4(position,1.);}', fragmentShader: mainFrag });

const brightUniforms = { uTex:{value:null}, uThresh:{value:0.75}, uRes:{value:new THREE.Vector2()} };
const brightMat = new THREE.ShaderMaterial({
  uniforms: brightUniforms,
  vertexShader: 'void main(){gl_Position=vec4(position,1.);}',
  fragmentShader: `
    precision highp float;
    uniform sampler2D uTex; uniform float uThresh; uniform vec2 uRes;
    // Soft-knee threshold (Karis/COD-style) — smoother bloom onset than step()
    void main(){
      vec2 uv = gl_FragCoord.xy / uRes.xy;
      vec3 c = texture2D(uTex, uv).rgb;
      float brightness = max(max(c.r, c.g), c.b);
      float knee = 0.25;
      float soft = brightness - uThresh + knee;
      soft = clamp(soft, 0.0, 2.0*knee);
      soft = soft * soft / (4.0 * knee + 0.0001);
      float contribution = max(soft, brightness - uThresh) / max(brightness, 0.0001);
      // Karis average — weight by inverse luminance to stop fireflies
      float lum = dot(c, vec3(0.299, 0.587, 0.114));
      float weight = 1.0 / (1.0 + lum);
      gl_FragColor = vec4(c * contribution * weight * 1.4, 1.0);
    }
  `
});

const blurUniforms = { uTex:{value:null}, uRes:{value:new THREE.Vector2()}, uDir:{value:new THREE.Vector2(1,0)} };
const blurMat = new THREE.ShaderMaterial({

  vertexShader: 'void main(){gl_Position=vec4(position,1.);}',
  fragmentShader: `

    uniform sampler2D uTex; uniform vec2 uRes; uniform vec2 uDir;

      c += texture2D(uTex, uv - 1.0*px).rgb * 0.15;
      c += texture2D(uTex, uv          ).rgb * 0.18;
      c += texture2D(uTex, uv + 1.0*px).rgb * 0.15;
      c += texture2D(uTex, uv + 2.0*px).rgb * 0.12;
      c += texture2D(uTex, uv + 3.0*px).rgb * 0.09;

const compUniforms = {
  uMain:{value:null}, uBloom:{value:null}, uBloom2:{value:null},
  uRes:{value:new THREE.Vector2()},
  uTime:{value:0}, uBeat:{value:0}, uBass:{value:0}, uMid:{value:0},
  uTreb:{value:0},
  uKAmount:{value:0},  // smoothed kaleidoscope amount, set from JS
};
const compMat = new THREE.ShaderMaterial({
  uniforms: compUniforms,
  vertexShader: 'void main(){gl_Position=vec4(position,1.);}',
  fragmentShader: `
    precision highp float;
    uniform sampler2D uMain, uBloom, uBloom2;
    uniform vec2 uRes;
    uniform float uTime, uBeat, uBass, uMid, uTreb, uKAmount;

    const float PI = 3.14159265359;
    const float TAU = 6.28318530718;

    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }

    vec3 aces(vec3 x){
      const float a = 2.51;
      const float b = 0.03;
      const float c = 2.43;
      const float d = 0.59;
      const float e = 0.14;
      return clamp((x * (a*x + b)) / (x * (c*x + d) + e), 0.0, 1.0);
    }

    mat2 rot(float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c); }

    // Kaleidoscope fold — n-fold radial symmetry
    vec2 kaleido(vec2 p, float n){
      float a = atan(p.y, p.x);
      float r = length(p);
      float seg = TAU / n;
      a = mod(a, seg);
      a = abs(a - seg * 0.5);
      return vec2(cos(a), sin(a)) * r;
    }

    void main(){
      vec2 uv = gl_FragCoord.xy / uRes.xy;
      vec2 cuv = uv - 0.5;

      // Sample original visual with subtle chromatic aberration. Kept low
      // so it doesn't amplify silhouette aliasing into RGB stair-steps.
      float ca = 0.0006 + uBass*0.0018 + uBeat*0.004;
      vec2 dir = cuv * 2.0;
      vec3 mainOrig;
      mainOrig.r = texture2D(uMain, uv + dir*ca).r;
      mainOrig.g = texture2D(uMain, uv).g;
      mainOrig.b = texture2D(uMain, uv - dir*ca).b;

      // ===== LOCAL UNIFORMITY DETECTION =====
      // Sample 4 nearby pixels to detect if this region is uniform.
      // No readback needed — runs entirely on GPU per pixel.
      float sampleR = 0.04; // sample radius in UV space
      vec3 cN = texture2D(uMain, uv + vec2(0.0,  sampleR)).rgb;
      vec3 cS = texture2D(uMain, uv + vec2(0.0, -sampleR)).rgb;
      vec3 cE = texture2D(uMain, uv + vec2( sampleR, 0.0)).rgb;
      vec3 cW = texture2D(uMain, uv + vec2(-sampleR, 0.0)).rgb;
      vec3 mean = (cN + cS + cE + cW + mainOrig) * 0.2;
      float localVar = length(cN - mean) + length(cS - mean) + length(cE - mean) + length(cW - mean);
      // Only trigger if the pixel is also bright (dark areas should stay dark, not kaleido)
      float meanBright = dot(mean, vec3(0.299, 0.587, 0.114));
      // Local kaleidoscope amount — gentle ramp
      float k = (1.0 - smoothstep(0.0, 0.06, localVar)) * smoothstep(0.1, 0.3, meanBright);
      k *= 0.5; // overall strength cap

      // Kaleidoscope sample from the same texture — picks up the visual's own colors
      vec3 mainK = mainOrig;
      if(k > 0.005){
        vec2 kp = cuv * 1.2;
        kp *= rot(uTime*0.15);
        float folds = 6.0;
        kp = kaleido(kp, folds);
        vec2 kSampleUV = clamp(kp + 0.5, 0.02, 0.98);
        mainK.r = texture2D(uMain, kSampleUV + dir*ca*0.5).r;
        mainK.g = texture2D(uMain, kSampleUV).g;
        mainK.b = texture2D(uMain, kSampleUV - dir*ca*0.5).b;
      }

      vec3 main = mix(mainOrig, mainK, k);

      // Bloom — mix two mips for a broader, more filmic glow
      vec3 bloomNear = texture2D(uBloom,  uv).rgb;
      vec3 bloomFar  = texture2D(uBloom2, uv).rgb;
      vec3 bloom = bloomNear * 0.40 + bloomFar * 0.55;
      vec3 col = main + bloom * (0.28 + uMid*0.18 + uBeat*0.12);

      // Subtle color grade: gentle teal/orange split
      vec3 shadowTint    = vec3(0.88, 0.95, 1.08);   // cool shadows
      vec3 highlightTint = vec3(1.08, 0.98, 0.88);   // warm highlights
      float lum = dot(col, vec3(0.299, 0.587, 0.114));
      float mixAmt = smoothstep(0.0, 0.7, lum);
      col *= mix(shadowTint, highlightTint, mixAmt);

      // Smooth vignette — gentle falloff from center to corners
      float vigDist = length(cuv) * 1.6;
      float vig = 1.0 - smoothstep(0.55, 1.15, vigDist);
      col *= mix(0.55, 1.0, vig);

      // Exposure + ACES tone mapping
      float exposure = 1.05 + uBeat * 0.15;
      col = aces(col * exposure);

      // Saturation boost — palette colors pop without clipping
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      col = mix(vec3(l), col, 1.18);

      // Dithered grain — uses time-animated hash, amount tied to luminance
      // so shadows dither more (where banding shows) and highlights stay clean
      float g = hash(gl_FragCoord.xy + fract(uTime) * 73.0);
      float grainAmt = mix(0.03, 0.015, smoothstep(0.0, 0.4, l));
      col += (g - 0.5) * grainAmt;

      // Light gamma for richer mids
      col = pow(max(col, 0.0), vec3(0.94));

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

  if(diagEnabled && diagEl){

const freqData = new Uint8Array(fftSize/2);

function setupAnalyser(node){
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = fftSize;
  // Higher = more temporal smoothing inside the analyser itself
  analyser.smoothingTimeConstant = 0.85;
  node.connect(analyser);

async function startMic(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') await audioCtx.resume();
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast('mic not supported on this browser');
      return;
    }
    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }});
    sourceNode = audioCtx.createMediaStreamSource(micStream);
    setupAnalyser(sourceNode);
    hideStart();
    setMode('mic input');
    toast('mic active');
    isPaused = false;
    updatePlayPauseIcon();
  } catch(e){
    if(e.name === 'NotAllowedError'){
      toast('mic blocked: enable in safari settings');
      // Open settings hint
      setTimeout(()=>toast('settings → safari → microphone'), 2200);
    } else if(e.name === 'NotFoundError'){
      toast('no microphone found');
    } else {
      toast('mic error: ' + (e.name || 'unknown'));
    }
    console.error(e);
  }
}

// Pending file waiting for explicit user-gesture play (iOS unlock)
let pendingFile = null;
let bufferSource = null;
let decodedBuffer = null;
let playStartTime = 0;
let playOffset = 0;

function startFile(file){
  diag('startFile enter');
  if(!file){ toast('no file selected'); return; }
  // No MIME-type gate — iOS returns empty types for many files. Let the
  // decoder decide. Errors surface in the diag panel.
  try { stopAllPlayback(); } catch(e){ diag('stopAll err: ' + e.message); }
  pendingFile = file;
  try { setMode((file.name || 'audio').slice(0, 22)); } catch(_){}
  try { hideStart(); } catch(e){ diag('hideStart err: ' + e.message); }
  try { showPlayOverlay(); } catch(e){ diag('showOverlay err: ' + e.message); }
  isPaused = false;
  try { updatePlayPauseIcon(); } catch(_){}
  diag('OVERLAY SHOWN — tap screen to play');
}

function stopAllPlayback(){
  if(mediaEl){ try{ mediaEl.pause(); mediaEl.remove(); }catch(_){} mediaEl = null; }
  if(bufferSource){ try{ bufferSource.stop(); bufferSource.disconnect(); }catch(_){} bufferSource = null; }
  if(sourceNode){ try{ sourceNode.disconnect(); }catch(_){} sourceNode = null; }
  if(analyser){ try{ analyser.disconnect(); }catch(_){} analyser = null; }
}

// Called from a real user gesture (tap on play overlay)
async function actuallyStartPlayback(){
  diag('overlay tapped');
  if(!pendingFile){ diag('no pendingFile'); return; }

  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  } catch(e){
    diag('ctx create err: ' + e.message);
    toast('audio not supported');
    return;
  }

  diag('ctx state pre-resume: ' + audioCtx.state);
  if(audioCtx.state === 'suspended'){
    try { await audioCtx.resume(); diag('ctx resumed'); } catch(e){ diag('resume err: ' + e.message); }
  }

  // CRITICAL: play a silent buffer immediately to fully unlock iOS audio output
  try {
    const silentBuf = audioCtx.createBuffer(1, 1, 22050);
    const silentSrc = audioCtx.createBufferSource();
    silentSrc.buffer = silentBuf;
    silentSrc.connect(audioCtx.destination);
    silentSrc.start(0);
  } catch(e){ console.warn('silent unlock failed', e); }

  toast('decoding...');
  diag('reading ' + (pendingFile.size || 0) + 'b');

  let arrayBuffer;
  try {
    arrayBuffer = await pendingFile.arrayBuffer();
    diag('read ok: ' + arrayBuffer.byteLength + 'b');
  } catch(e){
    diag('read err: ' + e.message);
    toast('cant read file');
    return;
  }

  try {
    decodedBuffer = await new Promise((resolve, reject) => {
      const p = audioCtx.decodeAudioData(arrayBuffer, resolve, reject);
      if(p && p.then) p.then(resolve, reject);
    });
    diag('decoded ' + decodedBuffer.duration.toFixed(1) + 's');
  } catch(e){
    diag('decode err: ' + ((e && e.message) || e));
    toast('cant decode: try wav or different mp3');
    return;
  }

  try {
    bufferSource = audioCtx.createBufferSource();
    bufferSource.buffer = decodedBuffer;
    bufferSource.loop = true;

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = fftSize;
    analyser.smoothingTimeConstant = 0.85;

    const gainNode = audioCtx.createGain();
    gainNode.gain.value = 1.0;

    bufferSource.connect(analyser);
    bufferSource.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    bufferSource.start(0);
    playStartTime = audioCtx.currentTime;

    hidePlayOverlay();
    diag('playing');
    toast('playing · ' + (pendingFile.name || '').slice(0, 18));
  } catch(e){
    diag('playback err: ' + e.message);
    toast('playback failed');
  }
}

function showPlayOverlay(){
  let overlay = document.getElementById('playOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'playOverlay';
    overlay.innerHTML = `
      <div class="play-card">
        <div class="play-circle">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="play-label">tap to play</div>
        <div class="play-hint">make sure ringer is on · turn up volume</div>
      </div>
    `;
    document.body.appendChild(overlay);
    // Use ONE handler that fires on both — guard against double-fire
    let firing = false;
    const handler = (e) => {
      e.preventDefault();
      if(firing) return;
      firing = true;
      actuallyStartPlayback().finally(() => { firing = false; });
    };
    overlay.addEventListener('touchend', handler, { passive: false });
    overlay.addEventListener('click', handler);
  }
  overlay.style.display = 'flex';
  requestAnimationFrame(() => overlay.classList.add('show'));
}
function hidePlayOverlay(){
  const overlay = document.getElementById('playOverlay');
  if(overlay){
    overlay.classList.remove('show');
    setTimeout(() => overlay.style.display = 'none', 350);
  }
}

function readAudio(dt){
  if(!analyser) return;
  analyser.getByteFrequencyData(freqData);
  const N = freqData.length;
  let b=0,m=0,t=0,bN=0,mN=0,tN=0;
  for(let i=0;i<N;i++){
    const v = freqData[i]/255;
    const r = i/N;
    if(r<0.06){b+=v;bN++;} else if(r<0.3){m+=v;mN++;} else {t+=v;tN++;}
  }
  b/=Math.max(1,bN); m/=Math.max(1,mN); t/=Math.max(1,tN);
  const lvl = (b+m+t)/3;

  // Two-stage smoothing with attack/release envelopes
  // Stage 1: raw -> smoothed (fast attack, medium release)
  function envelope(prev, target, attackRate, releaseRate, dt){
    const rate = target > prev ? attackRate : releaseRate;
    const k = 1 - Math.exp(-dt * rate);
    return prev + (target - prev) * k;
  }
  smoothed.bass  = envelope(smoothed.bass,  b,   18, 4, dt);
  smoothed.mid   = envelope(smoothed.mid,   m,   16, 5, dt);
  smoothed.treb  = envelope(smoothed.treb,  t,   20, 6, dt);
  smoothed.level = envelope(smoothed.level, lvl, 12, 3, dt);

  // Stage 2: smoothed -> visual (slow second pass kills jitter completely)
  const visK = 1 - Math.exp(-dt * 8);
  visual.bass  += (smoothed.bass  - visual.bass)  * visK;
  visual.mid   += (smoothed.mid   - visual.mid)   * visK;
  visual.treb  += (smoothed.treb  - visual.treb)  * visK;
  visual.level += (smoothed.level - visual.level) * visK;

  bassHist.shift(); bassHist.push(b);
  const avg = bassHist.reduce((s,x)=>s+x,0) / bassHist.length;
  const variance = bassHist.reduce((s,x)=>s+(x-avg)*(x-avg),0) / bassHist.length;
  const C = -0.0025714 * variance + 1.5142857;
  const isBeat = b > avg*C && b > 0.18 && (performance.now()-lastBeatT)>200;
  if(isBeat){ beatEnv = 1; lastBeatT = performance.now(); }
  else beatEnv *= Math.pow(0.0015, dt); // slower beat decay too
}

const SCENES = [
  { name:'lattice bloom',     palette:0, fb:0.72 },
  { name:'cross temple',      palette:3, fb:0.74 },
  { name:'voxel cluster',     palette:0, fb:0.72 },
  { name:'crystal field',     palette:2, fb:0.72 },
  { name:'glitch field',      palette:3, fb:0.78 },
  { name:'glyph storm',       palette:1, fb:0.80 },
];

let currentScene = 0;
let autoT = 0;
let autoSinceSwitch = 0;
let autoEnergyAcc = 0;
let fwdPos = 0;            // accumulated fly-through position (smooth)
let smoothedLevel = 0;     // heavily low-passed audio level for pacing
// Two-stage smoothed camera targets (target → targetSmooth → actual) for
// silk-smooth motion
let smTargetRotX = 0, smTargetRotY = 0, smTargetZoom = 1.35;
// Dramatic camera episodes — periodic bursts of extra motion for variety
let dramaT = 0;            // time inside current episode (0 = idle)
let dramaDur = 0;          // total duration of current episode
let dramaNext = 10;        // seconds until next episode may trigger
let dramaType = 0;         // 0=bank, 1=zoomPush, 2=zoomPull, 3=pitchDip
let dramaYaw = 0, dramaPitch = 0, dramaZoom = 0; // current contributions
let hudHidden = false;
let lastInteract = performance.now();

// ============= CROSSFADE TRANSITION STATE =============
// When the auto-pilot picks a new scene, we don't swap instantly.
// The shader renders both `currentScene` (A) and `transitionTo` (B)
// and blends with uSceneMix over TRANSITION_DURATION seconds.
let transitioning = false;
let transitionT = 0;
let transitionTo = 0;
const TRANSITION_DURATION = 1.4;

function startTransition(toIdx){
  toIdx = ((toIdx % SCENES.length) + SCENES.length) % SCENES.length;
  if(toIdx === currentScene || transitioning) return;
  transitionTo = toIdx;
  transitionT = 0;
  transitioning = true;
  const s = SCENES[toIdx];
  mainUniforms.uSceneB.value = toIdx;
  // Palette swap happens at transition start — the crossfade covers it
  mainUniforms.uPalette.value = s.palette;
  mainUniforms.uHue.value = Math.random();
  document.getElementById('scene-name').textContent = s.name;
  document.getElementById('scene-num').textContent = String(toIdx+1).padStart(2,'0');
}

function finalizeTransition(){
  currentScene = transitionTo;
  mainUniforms.uSceneA.value = currentScene;
  mainUniforms.uSceneMix.value = 0;
  transitioning = false;
  transitionT = 0;
}

// Set the starting scene immediately (no crossfade) — used for initial boot
function setInitialScene(i){
  currentScene = ((i % SCENES.length) + SCENES.length) % SCENES.length;
  const s = SCENES[currentScene];
  mainUniforms.uSceneA.value = currentScene;
  mainUniforms.uSceneB.value = currentScene;
  mainUniforms.uSceneMix.value = 0;
  mainUniforms.uPalette.value = s.palette;
  mainUniforms.uHue.value = Math.random();
  document.getElementById('scene-name').textContent = s.name;
  document.getElementById('scene-num').textContent = String(currentScene+1).padStart(2,'0');
}

  }
});

// ============= PLAY/PAUSE =============
let isPaused = false;
const PLAY_ICON = '<path d="M8 5v14l11-7z"/>';
const PAUSE_ICON = '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
function updatePlayPauseIcon(){
  const icon = document.getElementById('playpauseIcon');
  if(icon) icon.innerHTML = isPaused ? PLAY_ICON : PAUSE_ICON;
}
async function togglePlayPause(){
  if(!audioCtx){ toast('load audio first'); return; }
  if(isPaused){
    try { await audioCtx.resume(); isPaused = false; toast('playing'); }
    catch(e){ console.error(e); }
  } else {
    try { await audioCtx.suspend(); isPaused = true; toast('paused'); }
    catch(e){ console.error(e); }
  }
  updatePlayPauseIcon();
}
document.getElementById('playpause').addEventListener('click', () => { togglePlayPause(); bump(); });

// Helper: any control that should resume playback if paused
function resumeIfPaused(){
  if(isPaused && audioCtx){
    audioCtx.resume().catch(()=>{});
    isPaused = false;
    updatePlayPauseIcon();
  }
}

document.getElementById('full').addEventListener('click', () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
  bump();
});
document.getElementById('hide').addEventListener('click', () => {
  hudHidden = !hudHidden;
  document.getElementById('hud').classList.toggle('hidden', hudHidden);
  bump();
});

window.addEventListener('keydown', e => {
  bump();
  if(e.key.toLowerCase() === 'f'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  else if(e.key.toLowerCase() === 'h'){
    hudHidden = !hudHidden;
    document.getElementById('hud').classList.toggle('hidden', hudHidden);
  }
  else if(e.key.toLowerCase() === 'p'){ togglePlayPause(); }
  else if(e.key === '+' || e.key === '='){ setZoom(zoom * 0.9); }
  else if(e.key === '-' || e.key === '_'){ setZoom(zoom * 1.1); }
  else if(e.key === '0'){ setZoom(1.0); }
});
window.addEventListener('mousemove', bump);
window.addEventListener('touchstart', bump, { passive: true });

function bump(){ lastInteract = performance.now(); document.getElementById('hud').classList.remove('idle'); }

// ============= ZOOM CONTROLS =============
let zoom = 1.0;
const ZOOM_MIN = 0.20;
const ZOOM_MAX = 4.0;
function setZoom(z){
  zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
  mainUniforms.uZoom.value = zoom;
}

// --- Mouse wheel (desktop) ---
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.08 : 0.92;
  setZoom(zoom * factor);
  bump();
}, { passive: false });

// ============= ROTATION CONTROLS =============
let rotX = 0, rotY = 0;
function setRotation(rx, ry){
  rotX = Math.max(-Math.PI*0.45, Math.min(Math.PI*0.45, rx));
  rotY = ry;
  mainUniforms.uRotX.value = rotX;
  mainUniforms.uRotY.value = rotY;
}
function resetView(){
  setRotation(0, 0);
  setZoom(1.0);
}

// Smooth setters for auto mode — exponential approach toward target
function setZoomSmooth(target, dt, rate){
  const k = 1 - Math.exp(-dt * rate);
  const newZ = zoom + (target - zoom) * k;
  zoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZ));
  mainUniforms.uZoom.value = zoom;
}
function setRotationSmooth(targetX, targetY, dt, rate){
  const k = 1 - Math.exp(-dt * rate);
  setRotation(rotX + (targetX - rotX) * k, rotY + (targetY - rotY) * k);
}

// --- Mouse drag (desktop) ---
let mouseDown = false;
let mouseLast = { x: 0, y: 0 };
canvas.addEventListener('mousedown', e => {
  mouseDown = true;
  mouseLast.x = e.clientX;
  mouseLast.y = e.clientY;
  canvas.style.cursor = 'grabbing';
});
window.addEventListener('mouseup', () => { mouseDown = false; canvas.style.cursor = ''; });
window.addEventListener('mousemove', e => {
  if(!mouseDown) return;
  const dx = e.clientX - mouseLast.x;
  const dy = e.clientY - mouseLast.y;
  mouseLast.x = e.clientX;
  mouseLast.y = e.clientY;
  const sens = 0.005;
  setRotation(rotX + dy * sens, rotY + dx * sens);
  bump();
});
canvas.style.cursor = 'grab';

// --- Touch (pinch zoom + drag rotate) ---
let pinchStartDist = 0;
let pinchStartZoom = 1;
let lastTapTime = 0;
let touchLast = { x: 0, y: 0 };
let dragging = false;

canvas.addEventListener('touchstart', e => {
  if(e.touches.length === 2){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.hypot(dx, dy);
    pinchStartZoom = zoom;
    dragging = false;
  } else if(e.touches.length === 1){
    // Double-tap = reset view (zoom + rotation)
    const now = performance.now();
    if(now - lastTapTime < 320){
      resetView();
      lastTapTime = 0;
      dragging = false;
    } else {
      lastTapTime = now;
      // Start tracking for drag
      touchLast.x = e.touches[0].clientX;
      touchLast.y = e.touches[0].clientY;
      dragging = true;
    }
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if(e.touches.length === 2 && pinchStartDist > 0){
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    const ratio = pinchStartDist / dist;
    setZoom(pinchStartZoom * ratio);
    bump();
  } else if(e.touches.length === 1 && dragging){
    e.preventDefault();
    const dx = e.touches[0].clientX - touchLast.x;
    const dy = e.touches[0].clientY - touchLast.y;
    touchLast.x = e.touches[0].clientX;
    touchLast.y = e.touches[0].clientY;
    const sens = 0.006;
    setRotation(rotX + dy * sens, rotY + dx * sens);
    bump();
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  if(e.touches.length < 2) pinchStartDist = 0;
  if(e.touches.length === 0) dragging = false;
}, { passive: true });

window.addEventListener('paste', async e => {
  const items = e.clipboardData?.items || [];
  for(const it of items){
    if(it.type && it.type.startsWith('audio/')){
      const f = it.getAsFile();
      if(f){
        document.getElementById('pastePulse').classList.add('show');
        setTimeout(()=>document.getElementById('pastePulse').classList.remove('show'), 800);
        startFile(f);
        return;
      }
    }
  }
});

const dropEl = document.getElementById('drop');
['dragenter','dragover'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.add('show'); }));
['dragleave','drop'].forEach(ev => window.addEventListener(ev, e => { e.preventDefault(); dropEl.classList.remove('show'); }));
window.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer?.files?.[0];
  if(f && f.type.startsWith('audio/')){ startFile(f); }
  else if(f) toast('not an audio file');
});

window.addEventListener('touchstart', () => {
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if(mediaEl && mediaEl.paused) mediaEl.play().catch(()=>{});
}, { passive: true });

window.addEventListener('resize', resize);
function resize(){
  renderer.setSize(window.innerWidth, window.innerHeight);
  rtMain.dispose(); rtPrev.dispose();
  rtBloomA.dispose(); rtBloomB.dispose(); rtBloomC.dispose(); rtBloomD.dispose();
  rtMain = makeRT(W(), H());
  rtPrev = makeRT(W(), H());
  rtBloomA = makeRT(W()/2, H()/2);
  rtBloomB = makeRT(W()/2, H()/2);
  rtBloomC = makeRT(W()/4, H()/4);
  rtBloomD = makeRT(W()/4, H()/4);
}

// Pick a random starting scene for variety each time the page opens
setInitialScene(Math.floor(Math.random() * SCENES.length));

let lastT = performance.now();
let fpsAcc = 0, fpsT = 0;

function pass(material, target){
  mainMesh.material = material;
  renderer.setRenderTarget(target);
  renderer.render(sceneFs, camFs);
  renderer.setRenderTarget(null);
}

function tick(){
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT)/1000);
  lastT = now;

  // When paused, skip all updates and rendering — leaves the last frame on screen
  if(isPaused){
    requestAnimationFrame(tick);
    return;
  }

  readAudio(dt);

  mainUniforms.uTime.value += dt;
  mainUniforms.uRes.value.set(W(), H());
  mainUniforms.uBass.value = visual.bass;
  mainUniforms.uMid.value = visual.mid;
  mainUniforms.uTreb.value = visual.treb;
  mainUniforms.uLevel.value = visual.level;
  mainUniforms.uBeat.value = beatEnv > 0.7 ? 1 : 0;
  mainUniforms.uBeatDecay.value = beatEnv;
  mainUniforms.uPrev.value = rtPrev.texture;

  compUniforms.uTime.value = mainUniforms.uTime.value;
  compUniforms.uBeat.value = beatEnv;
  compUniforms.uBass.value = visual.bass;
  compUniforms.uMid.value = visual.mid;
  compUniforms.uTreb.value = visual.treb;
  compUniforms.uRes.value.set(W(), H());

  pass(mainMat, rtMain);

  brightUniforms.uTex.value = rtMain.texture;
  brightUniforms.uRes.value.set(W()/2, H()/2);
  pass(brightMat, rtBloomA);

  blurUniforms.uTex.value = rtBloomA.texture;
  blurUniforms.uRes.value.set(W()/2, H()/2);
  blurUniforms.uDir.value.set(1.5, 0);
  pass(blurMat, rtBloomB);

  blurUniforms.uTex.value = rtBloomB.texture;
  blurUniforms.uDir.value.set(0, 1.5);
  pass(blurMat, rtBloomA);

  blurUniforms.uTex.value = rtBloomA.texture;
  blurUniforms.uRes.value.set(W()/4, H()/4);
  blurUniforms.uDir.value.set(3, 0);
  pass(blurMat, rtBloomC);
  blurUniforms.uTex.value = rtBloomC.texture;
  blurUniforms.uDir.value.set(0, 3);
  pass(blurMat, rtBloomD);

  compUniforms.uMain.value = rtMain.texture;
  compUniforms.uBloom.value = rtBloomA.texture;
  compUniforms.uBloom2.value = rtBloomD.texture;
  // Kaleidoscope uniformity rescue — disabled (was causing render issues)
  compUniforms.uKAmount.value = 0;

  mainMesh.material = compMat;
  renderer.setRenderTarget(null);
  renderer.render(sceneFs, camFs);

  const tmp = rtPrev; rtPrev = rtMain; rtMain = tmp;

  // ============= ALWAYS-ON AUTO PILOT =============
  autoT += dt;
  autoEnergyAcc = autoEnergyAcc * 0.98 + visual.level * 0.02;

  // Heavily low-pass the audio level so fly-through pacing doesn't jerk
  smoothedLevel += (visual.level - smoothedLevel) * Math.min(1, dt * 0.8);

  // Smooth accumulated forward position — never jumps with audio
  fwdPos += dt * (0.22 + smoothedLevel * 0.18);
  mainUniforms.uFwd.value = fwdPos;

  // ----- Dramatic episode scheduler -----
  // Every 12-22s, trigger a slow dramatic camera move on top of the base
  // drift. Each episode eases in and out via a sine envelope.
  if(dramaT >= dramaDur){
    dramaNext -= dt;
    if(dramaNext <= 0){
      dramaT = 0;
      dramaDur = 7 + Math.random() * 4;          // 7-11s
      dramaNext = 12 + Math.random() * 10;       // gap before next
      dramaType = Math.floor(Math.random() * 4);
    }
    dramaYaw = dramaPitch = dramaZoom = 0;
  } else {
    dramaT += dt;
    const phase = dramaT / dramaDur;             // 0..1
    const env = Math.sin(phase * Math.PI);       // 0 → 1 → 0 ease
    if(dramaType === 0){
      // Banking turn — extra yaw arc, one direction
      const dir = (Math.floor(autoT * 0.1) % 2) ? 1 : -1;
      dramaYaw   = env * 0.9 * dir;
      dramaPitch = env * 0.04;
      dramaZoom  = env * -0.08;
    } else if(dramaType === 1){
      // Zoom push-in — get up close to the geometry
      dramaYaw   = 0;
      dramaPitch = env * -0.05;
      dramaZoom  = env * -0.55;
    } else if(dramaType === 2){
      // Zoom pull-back — wide reveal
      dramaYaw   = env * 0.3;
      dramaPitch = env *  0.06;
      dramaZoom  = env *  0.55;
    } else {
      // Pitch dip — look up/down then return
      const dir = (Math.floor(autoT * 0.07) % 2) ? 1 : -1;
      dramaYaw   = env * 0.2 * dir;
      dramaPitch = env * 0.18 * dir;
      dramaZoom  = env * -0.05;
    }
  }

  // ----- Base camera path (smooth + monotonic) -----
  const baseZoom = 1.4 + Math.sin(autoT * 0.05) * 0.12;
  const baseRotY = autoT * 0.10;                              // continuous orbit
  const baseRotX = Math.sin(autoT * 0.04) * 0.05;             // tiny pitch

  // ----- Two-stage smoothing (target → smTarget → actual) -----
  // First stage filters the raw target (incl. dramatic episode);
  // second stage in setRotationSmooth/setZoomSmooth filters again.
  // Result: silky smooth even on direction changes.
  const targetZoomRaw = baseZoom + dramaZoom;
  const targetRotYRaw = baseRotY + dramaYaw;
  const targetRotXRaw = baseRotX + dramaPitch;
  const k1 = 1 - Math.exp(-dt * 1.6);
  smTargetZoom += (targetZoomRaw - smTargetZoom) * k1;
  smTargetRotY += (targetRotYRaw - smTargetRotY) * k1;
  smTargetRotX += (targetRotXRaw - smTargetRotX) * k1;

  setZoomSmooth(smTargetZoom, dt, 0.6);
  setRotationSmooth(smTargetRotX, smTargetRotY, dt, 0.7);

  // Dynamic feedback — longer trails when music is pumping, tighter when quiet
  const base = SCENES[currentScene].fb;
  const feedbackTarget = Math.min(0.94, base + visual.level * 0.10 + beatEnv * 0.04);
  const curFb = mainUniforms.uFeedback.value;
  mainUniforms.uFeedback.value = curFb + (feedbackTarget - curFb) * (1 - Math.exp(-dt * 4));

  // Scene switching — only trigger if not already transitioning
  autoSinceSwitch += dt;
  if(!transitioning){
    const timeOK       = autoSinceSwitch > 14;
    const strongBeat   = beatEnv > 0.85  && autoSinceSwitch > 8;
    const veryStrong   = beatEnv > 0.92  && autoSinceSwitch > 6;
    const energySpike  = visual.level > autoEnergyAcc * 1.6 && autoSinceSwitch > 10;
    const forceSwitch  = autoSinceSwitch > 28;

    if(veryStrong || (timeOK && (strongBeat || energySpike)) || forceSwitch){
      let next = currentScene;
      while(next === currentScene && SCENES.length > 1){
        next = Math.floor(Math.random() * SCENES.length);
      }
      startTransition(next);
      autoSinceSwitch = 0;
    }
  }

  // Advance active transition — uSceneMix ramps 0→1 with smooth easing
  if(transitioning){
    transitionT += dt;
    const raw = Math.min(1, transitionT / TRANSITION_DURATION);
    // Ease-in-out cubic for a gentle blend curve
    const eased = raw < 0.5 ? 4*raw*raw*raw : 1 - Math.pow(-2*raw + 2, 3) / 2;
    mainUniforms.uSceneMix.value = eased;
    if(raw >= 1) finalizeTransition();
  }

  if(now - lastInteract > 4000 && analyser && !hudHidden){
    document.getElementById('hud').classList.add('idle');
  }
  document.getElementById('energy').textContent = visual.level.toFixed(2);

  fpsAcc++; fpsT += dt;
  if(fpsT > 0.5){
    document.getElementById('fps').textContent = String(Math.round(fpsAcc/fpsT)).padStart(2,'0');
    fpsAcc = 0; fpsT = 0;
  }

  requestAnimationFrame(tick);
}
tick();
</script>
